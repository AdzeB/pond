<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eagle-style video transport comparison</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20201f;
        background: #e9e9e7;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        height: 48px;
        padding: 14px 18px;
        background: #f7f7f5;
        border-bottom: 1px solid #d4d4d1;
      }
      h1 { margin: 0; font-size: 14px; font-weight: 600; }
      header span { color: #6f6f6b; }
      main {
        display: grid;
        grid-template-columns: 420px minmax(0, 1fr);
        gap: 12px;
        padding: 12px;
      }
      .references { display: grid; gap: 12px; align-content: start; }
      figure {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        background: #fff;
        border: 1px solid #cececa;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 8%);
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        padding: 9px 12px;
        font-weight: 600;
        border-bottom: 1px solid #dfdfdc;
      }
      figcaption span { font-weight: 400; color: #777; }
      .reference {
        display: grid;
        place-items: center;
        min-height: 164px;
        padding: 16px;
        background: #f3f3f1;
      }
      .reference img {
        display: block;
        max-width: 100%;
        max-height: 250px;
        object-fit: contain;
        border-radius: 6px;
      }
      .stage {
        position: relative;
        aspect-ratio: 1292 / 768;
        overflow: hidden;
        background: #f3f3f1;
      }
      iframe {
        position: absolute;
        inset: 0 auto auto 0;
        width: 1292px;
        height: 768px;
        border: 0;
        transform: scale(0.65);
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Eagle-inspired video transport</h1>
      <span>outline controls · dominant timeline · frame preview</span>
    </header>
    <main>
      <section class="references" aria-label="Eagle references">
        <figure>
          <figcaption>Eagle transport <span>control rhythm</span></figcaption>
          <div class="reference">
            <img
              src="/@fs/var/folders/sm/p05lq2nn4jd15ydyprjbt0b40000gn/T/codex-clipboard-a7d3face-1160-4035-b8cd-e55a6babc52a.png"
              alt="Eagle compact video transport reference"
            />
          </div>
        </figure>
        <figure>
          <figcaption>Eagle scrubber hover <span>frame + timestamp</span></figcaption>
          <div class="reference">
            <img
              src="/@fs/var/folders/sm/p05lq2nn4jd15ydyprjbt0b40000gn/T/codex-clipboard-8bef378e-3261-442e-a919-868c8b5b8d0e.png"
              alt="Eagle timeline hover preview reference"
            />
          </div>
        </figure>
      </section>
      <figure>
        <figcaption>Pond implementation <span>live</span></figcaption>
        <div class="stage">
          <iframe src="/video.html" title="Pond video viewer with Eagle-inspired transport"></iframe>
        </div>
      </figure>
    </main>
  </body>
</html>
