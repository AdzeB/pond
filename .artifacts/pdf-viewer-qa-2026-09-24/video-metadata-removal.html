<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video metadata removal comparison</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #222;
        background: #e9e9e7;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        height: 48px;
        padding: 14px 18px;
        background: #f7f7f5;
        border-bottom: 1px solid #d4d4d1;
      }
      h1 { margin: 0; font-size: 14px; font-weight: 600; }
      header span { color: #6f6f6b; }
      main {
        display: grid;
        grid-template-columns: 414px minmax(0, 1fr);
        gap: 12px;
        padding: 12px;
      }
      figure {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        background: #fff;
        border: 1px solid #cececa;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 8%);
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        padding: 9px 12px;
        font-weight: 600;
        border-bottom: 1px solid #dfdfdc;
      }
      figcaption span { font-weight: 400; color: #777; }
      .source {
        display: grid;
        place-items: center;
        min-height: 220px;
        padding: 24px;
        background: #f3f3f1;
      }
      .source img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 6px;
      }
      .stage {
        position: relative;
        aspect-ratio: 1292 / 768;
        overflow: hidden;
        background: #f3f3f1;
      }
      iframe {
        position: absolute;
        inset: 0 auto auto 0;
        width: 1292px;
        height: 768px;
        border: 0;
        transform: scale(0.65);
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Video toolbar metadata removal</h1>
      <span>Remove filename and size · keep actions balanced</span>
    </header>
    <main>
      <figure>
        <figcaption>Requested removal <span>before</span></figcaption>
        <div class="source">
          <img
            src="/@fs/var/folders/sm/p05lq2nn4jd15ydyprjbt0b40000gn/T/codex-clipboard-a62855e0-d05f-4ac7-9bf0-1cd0c0878a53.png"
            alt="Video filename and file size marked for removal"
          />
        </div>
      </figure>
      <figure>
        <figcaption>Pond implementation <span>after</span></figcaption>
        <div class="stage">
          <iframe src="/video.html" title="Pond video viewer without toolbar metadata"></iframe>
        </div>
      </figure>
    </main>
  </body>
</html>
