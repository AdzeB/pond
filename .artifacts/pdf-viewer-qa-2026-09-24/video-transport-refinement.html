<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video transport refinement comparison</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20201f;
        background: #e9e9e7;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        height: 48px;
        padding: 14px 18px;
        background: #f7f7f5;
        border-bottom: 1px solid #d4d4d1;
      }
      h1 { margin: 0; font-size: 14px; font-weight: 600; }
      header span { color: #6f6f6b; }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 12px;
      }
      figure {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        background: #fff;
        border: 1px solid #cececa;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 8%);
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        padding: 9px 12px;
        font-weight: 600;
        border-bottom: 1px solid #dfdfdc;
      }
      figcaption span { font-weight: 400; color: #777; }
      .source {
        display: grid;
        place-items: center;
        height: 260px;
        padding: 20px;
        background: #f3f3f1;
      }
      .source img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 6px;
      }
      .stage {
        position: relative;
        height: 260px;
        overflow: hidden;
        background: #f3f3f1;
      }
      iframe {
        position: absolute;
        top: -420px;
        left: 0;
        width: 1292px;
        height: 768px;
        border: 0;
        transform: scale(0.85);
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Video transport refinement</h1>
      <span>shortcut hints · clearer spacing · exact transport icons</span>
    </header>
    <main>
      <figure>
        <figcaption>Requested refinement <span>source annotation</span></figcaption>
        <div class="source">
          <img
            src="/@fs/var/folders/sm/p05lq2nn4jd15ydyprjbt0b40000gn/T/codex-clipboard-4ab37486-685a-476c-af75-9fd3af404737.png"
            alt="Annotated Pond playback controls requesting icon, tooltip, hotkey, and spacing refinements"
          />
        </div>
      </figure>
      <figure>
        <figcaption>Pond implementation <span>live focused crop</span></figcaption>
        <div class="stage">
          <iframe src="/video.html" title="Refined Pond video transport"></iframe>
        </div>
      </figure>
    </main>
  </body>
</html>
