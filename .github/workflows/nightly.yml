name: Nightly

# Publishes a signed, notarized Pond Nightly of `main` as a GitHub prerelease.
# Pond Nightly installs beside Pond with its own app data and default Library,
# and updates only from other nightlies. Stable Pond reads `releases/latest`,
# which never points at a prerelease.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # A scheduled run skips when `main` hasn't moved since the last nightly. A
  # manual run always builds.
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous: ${{ steps.plan.outputs.previous }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Plan nightly
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          PREVIOUS="$(gh release list --limit 100 \
            --json tagName,isDraft,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | contains("-nightly.")))] | sort_by(.createdAt) | last | .tagName // ""')"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"

          if [ -n "$PREVIOUS" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            PREVIOUS_SHA="$(gh api "repos/$GH_REPO/commits/$PREVIOUS" --jq .sha)"
            if [ "$PREVIOUS_SHA" = "$GITHUB_SHA" ]; then
              echo "main has no commits since $PREVIOUS; skipping."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # The next patch sorts after the current release and before the next one.
          VERSION="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("apps/desktop/package.json", "utf8"));
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
            if (!match) throw new Error(`apps/desktop/package.json has ${version}; expected X.Y.Z`);
            const date = new Date().toISOString().slice(0, 10).replaceAll("-", "");
            console.log(`${match[1]}.${match[2]}.${Number(match[3]) + 1}-nightly.${date}.${process.env.GITHUB_RUN_NUMBER}`);
          ')"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Pond Nightly $VERSION"

  macos:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-latest

    permissions:
      contents: write
      id-token: write

    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Generated files are up to date
        run: pnpm generate && git diff --exit-code

      - name: Verify workspace
        run: pnpm check

      - name: Build workspace
        run: pnpm build

      - name: Desktop end-to-end smoke
        run: pnpm --filter @pond/desktop smoke:desktop

      - name: Require signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_START=()
          if [ -n "$PREVIOUS" ]; then NOTES_START=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
            --title "Pond Nightly $VERSION" --generate-notes "${NOTES_START[@]}"

      # The version decides the runtime channel, so stamp it only into the
      # packaged app and never commit it.
      - name: Stamp nightly version
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "apps/desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          '

      - name: Package Pond Nightly and upload to prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @pond/desktop dist:mac:nightly --publish always

      - name: Verify prerelease assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          missing=0
          for name in "Pond-Nightly-${VERSION}-arm64.dmg" "Pond-Nightly-${VERSION}-arm64.zip" "nightly-mac.yml"; do
            if ! grep -Fxq "$name" <<<"$ASSETS"; then
              echo "Missing prerelease asset: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false --prerelease --latest=false

      - name: Discard draft after a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --yes
          fi

  prune:
    needs: macos
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Keep the last 7 nightlies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 \
            --json tagName,isDraft,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | contains("-nightly.")))] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
          while read -r tag; do
            echo "Deleting $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
