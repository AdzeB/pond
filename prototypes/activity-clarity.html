<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activity — process clarity prototype</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --panel: #ffffff;
        --panel-2: #fbfbfc;
        --ink: #15171a;
        --ink-2: #5b6470;
        --ink-3: #939aa4;
        --line: #e7e9ee;
        --line-2: #eef0f3;
        --accent: #1d9bf6;
        --accent-ink: #ffffff;
        --accent-soft: #e8f4fe;
        --green: #2bb673;
        --queued: #c3c8d1;
        --radius: 16px;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04),
          0 8px 24px rgba(16, 24, 40, 0.05);
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        padding: 0;
        margin: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
        line-height: 1.45;
        color: var(--ink);
        background: var(--bg);
        text-rendering: optimizeLegibility;
      }

      .wrap {
        max-width: 1040px;
        padding: 40px 28px 96px;
        margin: 0 auto;
      }

      /* ── header ─────────────────────────────────────────── */
      .head {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        font-weight: 680;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      .sub {
        max-width: 560px;
        margin: 0;
        color: var(--ink-2);
      }
      .sub b {
        font-weight: 620;
        color: var(--ink);
      }
      .sub .accent {
        font-weight: 620;
        color: var(--accent);
      }

      .head-actions {
        display: flex;
        flex: none;
        gap: 8px;
      }
      .btn {
        padding: 7px 14px;
        font: inherit;
        font-weight: 560;
        color: var(--ink);
        appearance: none;
        cursor: pointer;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        transition: background 0.12s ease, border-color 0.12s ease;
      }
      .btn:hover {
        background: var(--panel-2);
        border-color: #dcdfe6;
      }
      .btn.primary {
        color: var(--accent-ink);
        background: var(--accent);
        border-color: var(--accent);
      }
      .btn.primary:hover {
        background: #178ae0;
      }

      /* ── summary stats ──────────────────────────────────── */
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 24px;
      }
      .stat {
        padding: 16px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .stat .v {
        font-size: 28px;
        font-weight: 660;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }
      .stat .v.green {
        color: var(--green);
      }
      .stat .l {
        margin-top: 2px;
        font-size: 12px;
        font-weight: 540;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      /* ── main grid ──────────────────────────────────────── */
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 330px) 1fr;
        gap: 18px;
        align-items: start;
      }
      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .col-label {
        padding: 0 4px 8px;
        font-size: 12px;
        font-weight: 560;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      /* ── process list ───────────────────────────────────── */
      .list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .row {
        width: 100%;
        padding: 14px;
        font: inherit;
        text-align: left;
        appearance: none;
        cursor: pointer;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        transition: border-color 0.12s ease, background 0.12s ease;
      }
      .row:hover {
        border-color: #d8dbe2;
      }
      .row.active {
        background: #fcfeff;
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent) inset, var(--shadow);
      }
      .row-top {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
      }
      .row-name {
        font-weight: 620;
      }
      .pill {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        padding: 3px 9px;
        font-size: 11.5px;
        font-weight: 580;
        color: var(--ink-2);
        white-space: nowrap;
        background: var(--line-2);
        border-radius: 999px;
      }
      .pill.live {
        color: #1378c9;
        background: var(--accent-soft);
      }
      .pill .dot {
        width: 6px;
        height: 6px;
        background: currentColor;
        border-radius: 999px;
      }
      .pill.live .dot {
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      .counts {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 10px 0 9px;
        font-size: 13px;
        color: var(--ink-2);
      }
      .counts .run {
        font-weight: 600;
        color: var(--ink);
      }
      .counts .sep {
        color: var(--ink-3);
      }

      /* segmented usage bar */
      .bar {
        display: flex;
        height: 6px;
        overflow: hidden;
        background: var(--line-2);
        border-radius: 999px;
      }
      .bar span {
        display: block;
        height: 100%;
      }
      .bar .s-run {
        background: var(--accent);
      }
      .bar .s-queued {
        background: var(--queued);
      }
      .bar .s-done {
        background: var(--green);
      }

      /* ── detail panel ───────────────────────────────────── */
      .panel {
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .panel-head {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line-2);
      }
      .panel-head .title {
        font-size: 15px;
        font-weight: 660;
      }
      .panel-body {
        padding: 18px;
      }

      .legend {
        display: flex;
        gap: 12px;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 9px;
        font-size: 13px;
        color: var(--ink-2);
      }
      .legend .accent {
        font-weight: 620;
        color: var(--accent);
      }
      .legend .rem {
        font-size: 12px;
        color: var(--ink-3);
        white-space: nowrap;
      }
      .bar.lg {
        height: 8px;
      }

      .divider {
        height: 1px;
        margin: 18px 0;
        background: var(--line-2);
      }

      .item-row {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .item-row .k {
        font-size: 12px;
        font-weight: 560;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .item-row .v {
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        color: var(--ink-2);
      }

      /* ── stepper ────────────────────────────────────────── */
      .stepper {
        padding: 18px 18px 4px;
        background: var(--panel-2);
        border: 1px solid var(--line-2);
        border-radius: 12px;
      }
      .step {
        position: relative;
        display: flex;
        gap: 14px;
        padding-bottom: 18px;
      }
      .step:last-child {
        padding-bottom: 14px;
      }
      .step .gutter {
        position: relative;
        flex: none;
        width: 22px;
      }
      .step .line {
        position: absolute;
        top: 22px;
        bottom: -18px;
        left: 10px;
        width: 2px;
        background: var(--line);
      }
      .step.done .line {
        background: var(--accent);
      }
      .step:last-child .line {
        display: none;
      }
      .badge {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        background: var(--panel);
        border-radius: 999px;
      }
      .step.done .badge {
        background: var(--accent);
      }
      .step.active .badge {
        border: 2px solid var(--accent);
      }
      .step.active .badge .core {
        width: 8px;
        height: 8px;
        background: var(--accent);
        border-radius: 999px;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .step.pending .badge {
        border: 2px solid var(--queued);
      }
      .badge svg {
        display: block;
      }

      .step .body {
        display: flex;
        flex: 1;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        min-width: 0;
        min-height: 22px;
      }
      .step .label {
        font-weight: 560;
      }
      .step.active .label {
        font-weight: 640;
        color: var(--accent);
      }
      .step.pending .label {
        color: var(--ink-3);
      }
      .step .meta {
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
        color: var(--ink-3);
        white-space: nowrap;
      }
      .step.active .meta {
        color: var(--accent);
      }

      .foot {
        margin-top: 22px;
        font-size: 12px;
        color: var(--ink-3);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <div>
          <h1>Activity</h1>
          <p class="sub">
            Every background process shows what is
            <span class="accent">actually running</span> vs merely
            <b>queued</b>, plus a per-item lifecycle so progress is legible at a
            glance.
          </p>
        </div>
        <div class="head-actions">
          <button class="btn">Pause all</button>
          <button class="btn primary">Sync all</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="v" id="stat-running">0</div>
          <div class="l">Running now</div>
        </div>
        <div class="stat">
          <div class="v" id="stat-queued">0</div>
          <div class="l">Queued</div>
        </div>
        <div class="stat">
          <div class="v green" id="stat-done">0</div>
          <div class="l">Completed today</div>
        </div>
      </div>

      <div class="grid">
        <div>
          <div class="col-label">Processes</div>
          <div class="list" id="list"></div>
        </div>
        <div id="detail"></div>
      </div>

      <div class="foot">Prototype · static data · click a process to inspect its lifecycle</div>
    </div>

    <script>
      const PROCESSES = [
        {
          id: "enrichment",
          label: "On-device enrichment",
          state: "running",
          running: 2,
          queued: 14998,
          doneToday: 312,
          itemLabel: "caption · IMG_4821.jpg",
          steps: [
            { label: "Queued", meta: "12:25:01", state: "done" },
            { label: "Captioning", meta: "live", state: "active" },
            { label: "Embedding", meta: "waiting", state: "pending" },
            { label: "Auto-title", meta: "waiting", state: "pending" },
            { label: "Tagged", meta: "waiting", state: "pending" },
          ],
        },
        {
          id: "ingest",
          label: "Ingest pipeline",
          state: "running",
          running: 3,
          queued: 921,
          doneToday: 146,
          itemLabel: "youtube.com/watch?v=… · 1 of 921",
          steps: [
            { label: "Submitted", meta: "12:22:04", state: "done" },
            { label: "Downloading", meta: "live", state: "active" },
            { label: "Processing", meta: "queued", state: "pending" },
            { label: "Saved", meta: "—", state: "pending" },
          ],
        },
        {
          id: "refresh",
          label: "Metadata refresh",
          state: "running",
          running: 1,
          queued: 38,
          doneToday: 210,
          itemLabel: "are.na · block 9931",
          steps: [
            { label: "Submitted", meta: "12:18:50", state: "done" },
            { label: "Fetching", meta: "live", state: "active" },
            { label: "Merged", meta: "waiting", state: "pending" },
            { label: "Saved", meta: "—", state: "pending" },
          ],
        },
      ];

      const fmt = (n) => n.toLocaleString("en-US");
      let selectedId = PROCESSES[0].id;
      let elapsed = 8; // seconds on the active step

      const CHECK =
        '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">' +
        '<path d="M2.6 6.3 L5 8.6 L9.4 3.7" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      function barSegments(p) {
        const total = p.running + p.queued + p.doneToday;
        const pct = (n) => (n / total) * 100;
        return (
          '<span class="s-run" style="width:' +
          pct(p.running) +
          '%"></span>' +
          '<span class="s-queued" style="width:' +
          pct(p.queued) +
          '%"></span>' +
          '<span class="s-done" style="width:' +
          pct(p.doneToday) +
          '%"></span>'
        );
      }

      function renderList() {
        const el = document.getElementById("list");
        el.innerHTML = PROCESSES.map((p) => {
          const live = p.state === "running";
          return (
            '<button class="row ' +
            (p.id === selectedId ? "active" : "") +
            '" data-id="' +
            p.id +
            '">' +
            '<div class="row-top">' +
            '<span class="row-name">' +
            p.label +
            "</span>" +
            '<span class="pill ' +
            (live ? "live" : "") +
            '"><span class="dot"></span>' +
            (live ? "Running" : "Paused") +
            "</span>" +
            "</div>" +
            '<div class="counts"><span class="run">' +
            p.running +
            " running</span><span class=\"sep\">·</span><span>" +
            fmt(p.queued) +
            " queued</span></div>" +
            '<div class="bar">' +
            barSegments(p) +
            "</div>" +
            "</button>"
          );
        }).join("");

        el.querySelectorAll(".row").forEach((r) =>
          r.addEventListener("click", () => {
            selectedId = r.dataset.id;
            render();
          }),
        );
      }

      function fmtElapsed(s) {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return (
          `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`
        );
      }

      function renderStep(s, _isLast) {
        let badgeInner = "";
        if (s.state === "done") badgeInner = CHECK;
        else if (s.state === "active") badgeInner = '<span class="core"></span>';
        const meta =
          s.meta === "live" ? `elapsed ${fmtElapsed(elapsed)}` : s.meta;
        return (
          '<div class="step ' +
          s.state +
          '">' +
          '<div class="gutter"><div class="line"></div>' +
          '<div class="badge">' +
          badgeInner +
          "</div></div>" +
          '<div class="body"><span class="label">' +
          s.label +
          '</span><span class="meta">' +
          meta +
          "</span></div>" +
          "</div>"
        );
      }

      function renderDetail() {
        const p = PROCESSES.find((x) => x.id === selectedId) || PROCESSES[0];
        const remaining = p.running + p.queued;
        const detail = document.getElementById("detail");
        detail.innerHTML =
          '<div class="panel">' +
          '<div class="panel-head">' +
          '<span class="title">' +
          p.label +
          "</span>" +
          '<span class="pill live"><span class="dot"></span>' +
          p.running +
          " active now</span>" +
          "</div>" +
          '<div class="panel-body">' +
          '<div class="legend"><span><span class="accent">' +
          p.running +
          " running</span> · " +
          fmt(p.queued) +
          " queued · " +
          fmt(p.doneToday) +
          ' done today</span><span class="rem">' +
          fmt(remaining) +
          " remaining</span></div>" +
          '<div class="bar lg">' +
          barSegments(p) +
          "</div>" +
          '<div class="divider"></div>' +
          '<div class="item-row"><span class="k">Current item</span><span class="v">' +
          p.itemLabel +
          "</span></div>" +
          '<div class="stepper">' +
          p.steps
            .map((s, i) => renderStep(s, i === p.steps.length - 1))
            .join("") +
          "</div>" +
          "</div></div>";
      }

      function renderStats() {
        const r = PROCESSES.reduce((a, p) => a + p.running, 0);
        const q = PROCESSES.reduce((a, p) => a + p.queued, 0);
        const d = PROCESSES.reduce((a, p) => a + p.doneToday, 0);
        document.getElementById("stat-running").textContent = fmt(r);
        document.getElementById("stat-queued").textContent = fmt(q);
        document.getElementById("stat-done").textContent = fmt(d);
      }

      function render() {
        renderStats();
        renderList();
        renderDetail();
      }

      render();
      // live elapsed clock on the active step
      setInterval(() => {
        elapsed += 1;
        renderDetail();
      }, 1000);
    </script>
  </body>
</html>
