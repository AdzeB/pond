# Same Pond app as stable. Only the update feed differs: electron-updater on the
# Nightly channel reads `nightly-mac.yml` from the newest nightly prerelease.
#
# Arrays merge with the parent config, so pick the arch on the command line:
#   electron-builder --config electron-builder.nightly.yml --mac dmg zip --arm64
extends: electron-builder.yml

publish:
  provider: github
  owner: raphaelsalaja
  repo: pond
  releaseType: prerelease
  channel: nightly
