<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Install the Pond extension</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url("../../../extension/public/fonts/inter/variable.woff2")
          format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        position: relative;
        width: 640px;
        height: 320px;
        margin: 0;
        overflow: hidden;
        font-family: Inter, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #202124;
        background: #fff;
      }

      .window {
        display: flex;
        flex-direction: column;
        width: 640px;
        height: 320px;
      }

      .toolbar {
        display: flex;
        flex: none;
        gap: 14px;
        align-items: center;
        height: 56px;
        padding: 0 16px;
        border-bottom: 1px solid #e6e8eb;
      }

      .lights {
        display: flex;
        flex: none;
        gap: 7px;
      }

      .lights span {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }

      .lights span:nth-child(1) {
        background: #ff5f57;
      }

      .lights span:nth-child(2) {
        background: #febc2e;
      }

      .lights span:nth-child(3) {
        background: #28c840;
      }

      .omnibox {
        display: flex;
        flex: 1;
        align-items: center;
        min-width: 0;
        height: 40px;
        padding: 0 16px;
        overflow: hidden;
        background: #f1f3f4;
        border-radius: 20px;
      }

      .omnibox strong {
        font-size: 20px;
        font-weight: 560;
        color: #202124;
        white-space: nowrap;
      }

      .omnibox .scheme {
        color: #80868b;
      }

      .caret {
        width: 1.5px;
        height: 18px;
        margin-left: 1px;
        background: #202124;
      }

      .progress {
        position: absolute;
        top: 55px;
        left: 0;
        width: 640px;
        height: 2px;
        background: #1a73e8;
        opacity: 0;
        transform-origin: left center;
      }

      .page,
      .load,
      .card,
      .scrim,
      .dialog,
      .cursor,
      .ripple {
        opacity: 0;
      }

      .page {
        position: relative;
        flex: 1;
        min-height: 0;
        padding: 22px 28px 18px;
      }

      .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 620;
      }

      .dev {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 16px;
        font-weight: 520;
        color: #3c4043;
      }

      .switch {
        position: relative;
        width: 46px;
        height: 28px;
        background: #e1e3e4;
        border-radius: 14px;
      }

      .switch i {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }

      .load {
        display: inline-flex;
        align-items: center;
        height: 40px;
        padding: 0 16px;
        margin-top: 16px;
        font-size: 16px;
        font-weight: 560;
        color: #1a73e8;
        background: #fff;
        border: 1px solid #dadce0;
        border-radius: 8px;
      }

      .load[data-hot] {
        background: #e8f0fe;
        border-color: #d2e3fc;
      }

      .card {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 14px 16px;
        margin-top: 16px;
        border: 1px solid #e6e8eb;
        border-radius: 12px;
      }

      .mark {
        flex: none;
      }

      .card p {
        margin: 2px 0 0;
        font-size: 14px;
        font-weight: 450;
        color: #5f6368;
      }

      .card strong {
        font-size: 16px;
        font-weight: 620;
      }

      .card .copy {
        flex: 1;
        min-width: 0;
      }

      .scrim {
        position: absolute;
        inset: 56px 0 0;
        background: rgba(32, 33, 36, 0.32);
      }

      .dialog {
        position: absolute;
        top: 188px;
        left: 320px;
        width: 600px;
        overflow: hidden;
        background: #fff;
        border-radius: 12px;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.06),
          0 18px 50px rgba(0, 0, 0, 0.18);
      }

      .dialog-body {
        display: flex;
        height: 140px;
      }

      .side {
        flex: none;
        width: 148px;
        padding: 10px;
        background: #f5f5f7;
        border-right: 1px solid #e6e6e8;
      }

      .side span {
        display: block;
        padding: 6px 8px;
        font-size: 14px;
        font-weight: 560;
        color: #1c1c1e;
        border-radius: 6px;
      }

      .side span[data-current] {
        background: #e4e4e8;
      }

      .list {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 4px;
        justify-content: center;
        min-width: 0;
        padding: 8px 12px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        height: 44px;
        padding: 0 12px;
        font-size: 17px;
        font-weight: 560;
        color: #1c1c1e;
        border-radius: 8px;
      }

      #zip {
        font-weight: 480;
        color: #8e8e93;
      }

      .row[data-selected] {
        color: #fff;
        background: #0a84ff;
      }

      .row svg {
        flex: none;
      }

      #folder svg {
        color: #5aa6f5;
      }

      #folder[data-selected] svg {
        color: #fff;
      }

      .footer {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding: 12px;
        border-top: 1px solid #e6e6e8;
      }

      .footer button {
        height: 32px;
        padding: 0 14px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        border: 0;
        border-radius: 8px;
      }

      .cancel {
        color: #1c1c1e;
        background: #e5e5ea;
      }

      .select {
        color: #fff;
        background: #0a84ff;
      }

      .select[data-disabled] {
        color: #aeaeb2;
        background: #e5e5ea;
      }

      .select[data-hot] {
        filter: brightness(0.92);
      }

      .cursor {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 5;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.25));
      }

      .ripple {
        position: absolute;
        z-index: 4;
        width: 28px;
        height: 28px;
        border: 2px solid rgba(26, 115, 232, 0.7);
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="toolbar">
        <div class="lights" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="omnibox" id="omnibox">
          <strong><span class="scheme" id="scheme"></span><span id="rest"></span></strong>
          <i class="caret" id="caret"></i>
        </div>
      </div>
      <div class="progress" id="progress"></div>
      <div class="page" id="page">
        <div class="heading">
          <h1>Extensions</h1>
          <div class="dev">
            Developer mode
            <div class="switch" id="switch"><i id="knob"></i></div>
          </div>
        </div>
        <div class="load" id="load">Load unpacked</div>
        <div class="card" id="card">
          <svg class="mark" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
            <rect width="40" height="40" rx="9" fill="#56BC76" />
            <svg x="5" y="5" width="30" height="30" viewBox="-5 -5 217 217" aria-hidden="true">
              <path
                fill="#fff"
                fill-rule="evenodd"
                d="M120.711 14.6446C140.237 -4.88145 171.895 -4.88142 191.421 14.6446C210.947 34.1707 210.947 65.8283 191.421 85.3545L177.279 99.4967C175.326 101.449 175.326 104.615 177.279 106.568L191.421 120.71C210.947 140.236 210.947 171.895 191.421 191.421C171.895 210.947 140.237 210.947 120.711 191.421L106.568 177.278C104.615 175.325 101.449 175.325 99.4967 177.278L85.3555 191.421C65.8293 210.947 34.1708 210.947 14.6446 191.421C-4.88146 171.895 -4.88159 140.236 14.6446 120.71L28.7868 106.568C30.7394 104.615 30.7394 101.449 28.7868 99.4967L14.6446 85.3545C-4.88125 65.8283 -4.88141 34.1707 14.6446 14.6446C34.1707 -4.88153 65.8293 -4.88151 85.3555 14.6446L99.4969 28.786C101.449 30.7385 104.615 30.7386 106.568 28.7862L120.711 14.6446ZM72.2891 53C61.2434 53.0001 52.2891 61.9544 52.2891 73V133C52.2893 144.046 61.2436 153 72.2891 153H132.289C143.335 153 152.289 144.046 152.289 133V73C152.289 61.9543 143.335 53 132.289 53H72.2891Z"
              />
            </svg>
          </svg>
          <div class="copy">
            <strong>Pond</strong>
            <p>Saves pages and images into your library.</p>
          </div>
          <div class="switch" id="card-switch"><i id="card-knob"></i></div>
        </div>
      </div>
    </div>
    <div class="scrim" id="scrim"></div>
    <div class="dialog" id="dialog">
      <div class="dialog-body">
        <div class="side">
          <span data-current>Downloads</span>
        </div>
        <div class="list">
          <div class="row" id="zip">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
              <path
                fill="#8e8e93"
                d="M4 1.5h6.2L14.5 6v10.2a.8.8 0 0 1-.8.8H4a.8.8 0 0 1-.8-.8V2.3a.8.8 0 0 1 .8-.8Z"
              />
              <path fill="#fff" d="M10 1.8V6h4.1" />
            </svg>
            pond-extension.zip
          </div>
          <div class="row" id="folder">
            <svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M1.2 2.4A1.2 1.2 0 0 1 2.4 1.2h4l1.6 1.8h7.6a1.2 1.2 0 0 1 1.2 1.2v9.2a1.2 1.2 0 0 1-1.2 1.2H2.4a1.2 1.2 0 0 1-1.2-1.2V2.4Z"
              />
            </svg>
            pond-extension
          </div>
        </div>
      </div>
      <div class="footer">
        <button class="cancel" type="button">Cancel</button>
        <button class="select" id="select" type="button">Select</button>
      </div>
    </div>
    <div class="ripple" id="ripple"></div>
    <svg class="cursor" id="cursor" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <path
        fill="#fff"
        stroke="#111"
        stroke-width="1.4"
        stroke-linejoin="round"
        d="M4.2 2.2 4.2 16.2 8.1 12.7 11.2 19.2 13.7 18.1 10.6 11.6 16.4 11.1Z"
      />
    </svg>
    <script>
      const FPS = 30;
      const url = "chrome://extensions";
      const scheme = "chrome://";

      const $ = (id) => document.getElementById(id);

      function clamp01(v) {
        return Math.max(0, Math.min(1, v));
      }

      function span(t, a, b) {
        return clamp01((t - a) / (b - a));
      }

      function easeOut(p) {
        return 1 - (1 - p) ** 3;
      }

      function easeInOut(p) {
        return p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2;
      }

      function lerp(a, b, p) {
        return a + (b - a) * p;
      }

      function center(id) {
        const rect = $(id).getBoundingClientRect();
        return {
          x: rect.left + rect.width / 2,
          y: rect.top + rect.height / 2,
        };
      }

      function travel(t, from, to, a, b) {
        const p = easeInOut(span(t, a, b));
        return { x: lerp(from.x, to.x, p), y: lerp(from.y, to.y, p) };
      }

      function press(t, at) {
        const down = easeOut(span(t, at, at + 0.08));
        const up = easeOut(span(t, at + 0.08, at + 0.22));
        return 1 - 0.035 * down * (1 - up);
      }

      function placeCursor(point, opacity, scale) {
        const cursor = $("cursor");
        cursor.style.opacity = String(opacity);
        cursor.style.transform = `translate(${point.x - 4}px, ${point.y - 2}px) scale(${scale})`;
      }

      function ripple(t, at, point) {
        const p = span(t, at, at + 0.38);
        const node = $("ripple");
        if (p <= 0 || p >= 1) {
          node.style.opacity = "0";
          return;
        }
        const scale = lerp(0.3, 1.35, easeOut(p));
        node.style.opacity = String(1 - p);
        node.style.transform = `translate(${point.x - 14}px, ${point.y - 14}px) scale(${scale})`;
      }

      window.renderFrame = (frame) => {
        const t = frame / FPS;
        const typed = Math.round(span(t, 0.55, 2.35) * url.length);
        const shown = url.slice(0, typed);
        $("scheme").textContent = shown.slice(0, Math.min(shown.length, scheme.length));
        $("rest").textContent = shown.slice(scheme.length);

        const typing = t >= 0.55 && t < 2.35;
        const caretOn = t >= 0.25 && t < 2.7 && (typing || Math.floor(t * 2) % 2 === 0);
        $("caret").style.opacity = caretOn ? "1" : "0";

        const loading = span(t, 2.45, 2.85);
        $("progress").style.opacity = String(loading > 0 && loading < 1 ? 1 : 0);
        $("progress").style.transform = `scaleX(${easeOut(loading)})`;

        const dialogIn = easeOut(span(t, 5.55, 5.95));
        const dialogOut = easeOut(span(t, 8.2, 8.55));
        const dialog = dialogIn * (1 - dialogOut);
        const pageIn = easeOut(span(t, 2.7, 3.15));
        $("page").style.opacity = String(pageIn * (1 - dialog));
        $("page").style.transform = `translateY(${lerp(8, 0, pageIn)}px)`;

        const toggled = easeOut(span(t, 4.05, 4.32));
        $("switch").style.background = toggled > 0.45 ? "#1a73e8" : "#e1e3e4";
        $("knob").style.transform = `translateX(${lerp(0, 18, toggled)}px)`;

        const loadIn = easeOut(span(t, 4.38, 4.72));
        $("load").style.opacity = String(loadIn);
        $("load").style.transform = `translateY(${lerp(8, 0, loadIn)}px) scale(${press(t, 5.35)})`;
        $("load").toggleAttribute("data-hot", t >= 5.15 && t < 5.55);

        const picked = t >= 7.05;
        $("folder").toggleAttribute("data-selected", picked);
        $("select").toggleAttribute("data-disabled", !picked);
        $("select").toggleAttribute("data-hot", t >= 7.85 && t < 8.15);
        $("select").style.transform = `scale(${press(t, 7.95)})`;

        $("scrim").style.opacity = String(dialog);
        $("dialog").style.opacity = String(dialog);
        $("dialog").style.transform = `translate(-50%, -50%) scale(${lerp(0.96, 1, dialog)})`;

        const cardIn = easeOut(span(t, 8.6, 9.05));
        $("card").style.opacity = String(cardIn);
        $("card").style.transform = `translateY(${lerp(10, 0, cardIn)}px)`;
        $("card-switch").style.background = "#1a73e8";
        $("card-knob").style.transform = "translateX(18px)";

        const barRect = $("omnibox").getBoundingClientRect();
        const bar = {
          x: barRect.left + 36,
          y: barRect.top + barRect.height / 2,
        };
        const toggle = center("switch");
        const load = center("load");
        const folder = center("folder");
        const select = center("select");
        const off = { x: bar.x, y: bar.y };

        let point = off;
        let opacity = 0;
        if (t < 0.35) {
          point = { x: bar.x + 180, y: bar.y + 70 };
          opacity = span(t, 0.05, 0.35);
        } else if (t < 0.7) {
          point = travel(t, { x: bar.x + 40, y: bar.y + 36 }, { x: bar.x, y: bar.y }, 0.35, 0.65);
          opacity = 1;
        } else if (t < 2.5) {
          point = bar;
          opacity = 1 - span(t, 0.68, 0.82);
        } else if (t < 3.35) {
          opacity = 0;
          point = toggle;
        } else if (t < 3.95) {
          point = travel(t, { x: toggle.x + 30, y: toggle.y + 40 }, toggle, 3.35, 3.9);
          opacity = span(t, 3.35, 3.6);
        } else if (t < 4.7) {
          point = toggle;
          opacity = 1 - span(t, 4.4, 4.65);
        } else if (t < 5.3) {
          point = travel(t, toggle, load, 4.7, 5.2);
          opacity = 1;
        } else if (t < 5.7) {
          point = load;
          opacity = 1 - span(t, 5.5, 5.7);
        } else if (t < 6.7) {
          point = travel(t, { x: folder.x + 40, y: folder.y + 30 }, folder, 6.35, 6.7);
          opacity = span(t, 6.35, 6.6) * dialog;
        } else if (t < 7.4) {
          point = folder;
          opacity = dialog;
        } else if (t < 7.9) {
          point = travel(t, folder, select, 7.4, 7.85);
          opacity = dialog;
        } else if (t < 8.3) {
          point = select;
          opacity = dialog * (1 - span(t, 8.1, 8.3));
        }

        const click =
          (t >= 0.62 && t < 0.78) ||
          (t >= 3.95 && t < 4.12) ||
          (t >= 5.35 && t < 5.52) ||
          (t >= 7.0 && t < 7.18) ||
          (t >= 7.95 && t < 8.12);
        placeCursor(point, opacity, click ? 0.92 : 1);

        const ripples = [0.65, 4.0, 5.38, 7.02, 7.98];
        const spots = [bar, toggle, load, folder, select];
        let drawn = false;
        for (let i = 0; i < ripples.length; i++) {
          const p = span(t, ripples[i], ripples[i] + 0.38);
          if (p > 0 && p < 1) {
            ripple(t, ripples[i], spots[i]);
            drawn = true;
          }
        }
        if (!drawn) $("ripple").style.opacity = "0";
      };
    </script>
  </body>
</html>
