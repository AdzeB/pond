<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self' pond:; img-src 'self' data: blob: pond: https:; media-src 'self' data: blob: pond: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:* https:; font-src 'self' data:"
		/>
		<title>Pond: Suggestion</title>
		<link
			rel="preload"
			href="/src/assets/fonts/inter/variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<style>
			:root {
				font-family:
					inter-variable, ui-sans-serif, system-ui, -apple-system,
					"SF Pro Text", "Segoe UI", sans-serif;
				color-scheme: light dark;
			}
			html[data-theme="light"] {
				color: #1a1a1a;
				color-scheme: light;
				background: #ffffff;
			}
			html[data-theme="dark"] {
				color: #ededed;
				color-scheme: dark;
				background: #000000;
			}
			html,
			body {
				height: 100%;
				margin: 0;
				overflow: hidden;
				overscroll-behavior: none;
			}
		</style>
		<script>
			(() => {
				try {
					const raw = localStorage.getItem("pondShell");
					const shell = raw ? JSON.parse(raw) : {};
					let theme = shell.theme;
					if (theme !== "light" && theme !== "dark") {
						theme = window.matchMedia("(prefers-color-scheme: dark)").matches
							? "dark"
							: "light";
					}
					document.documentElement.setAttribute("data-theme", theme);
					document.documentElement.classList.add(theme);
				} catch {}
			})();
		</script>
	</head>
	<body>
		<div id="suggestion-root"></div>
		<script type="module" src="/src/suggestion.tsx"></script>
	</body>
</html>
