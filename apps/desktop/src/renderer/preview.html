<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Preview</title>
  </head>
  <body>
    <div id="preview-ui"></div>
    <main id="preview" aria-label="Media preview">
      <img id="image" alt="" draggable="false" hidden />
      <!-- biome-ignore lint/a11y/useMediaCaption: This preview plays user-owned video files; the Save file contract does not provide an associated caption track. -->
      <video id="video" controls playsinline preload="metadata" hidden></video>
      <div id="media-error" role="alert" hidden>
        <p>This preview could not be rendered. You can still open or export the original.</p>
        <button id="retry" type="button">Try Again</button>
      </div>
    </main>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
