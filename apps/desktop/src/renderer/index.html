<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self' pond:; img-src 'self' data: blob: pond: https:; media-src 'self' data: blob: pond: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob: pond: http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:* https:; font-src 'self' data:"
		/>
		<title>Pond</title>
		<link
			rel="preload"
			href="/src/assets/fonts/inter/variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/src/assets/fonts/jetbrains-mono/latin-600-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<style>
			/* Pre-bundle shell paint. Resolved tokens that mirror
			   packages/ui/src/theme.css so the very first frame already
			   looks like Pond before main.tsx parses. */
			:root {
				font-family:
					inter-variable, ui-sans-serif, system-ui, -apple-system,
					"SF Pro Text", "Segoe UI", sans-serif;
				color-scheme: light dark;
			}
			html[data-theme="light"] {
				color: #1a1a1a;
				color-scheme: light;
				background: #ffffff;
			}
			html[data-theme="dark"] {
				color: #ededed;
				color-scheme: dark;
				background: #000000;
			}
			/* Native Liquid Glass: clear the window background so the
			   NSGlassEffectView backing shows, and lay a translucent scrim on
			   the body so refracted desktop stays readable behind content. */
			html[data-glass="true"][data-theme="light"] {
				background: transparent;
			}
			html[data-glass="true"][data-theme="dark"] {
				background: transparent;
			}
			html[data-glass="true"][data-theme="light"] body {
				background: rgba(255, 255, 255, 0.55);
			}
			html[data-glass="true"][data-theme="dark"] body {
				background: rgba(18, 18, 18, 0.45);
			}
			html,
			body {
				height: 100%;
				margin: 0;
				overflow: hidden;
				overscroll-behavior: none;
			}
			#root {
				display: flex;
				flex-direction: column;
				height: 100%;
				isolation: isolate;
			}
		</style>
		<script>
			(() => {
				try {
					const hint = window.__pondShell || {};
					const raw = localStorage.getItem("pondShell");
					const stored = raw ? JSON.parse(raw) : {};
					const shell = { ...stored, ...hint };
					const doc = document.documentElement;

					let theme = shell.theme;
					if (theme !== "light" && theme !== "dark") {
						theme = window.matchMedia("(prefers-color-scheme: dark)").matches
							? "dark"
							: "light";
					}
					doc.setAttribute("data-theme", theme);
					doc.classList.add(theme);

					const setNum = (key, prop) => {
						if (typeof shell[key] === "number")
							doc.style.setProperty(prop, String(shell[key]));
					};
					setNum("baseL", "--ds-base-l");
					setNum("baseC", "--ds-base-c");
					setNum("baseH", "--ds-base-h");
					setNum("accentL", "--ds-accent-l");
					setNum("accentC", "--ds-accent-c");
					setNum("accentH", "--ds-accent-h");
					setNum("contrast", "--ds-contrast");
					setNum("fgDir", "--ds-fg-dir");

					if (shell.pointerCursors)
						doc.setAttribute("data-pointer-cursors", "true");

					if (shell.glass) doc.setAttribute("data-glass", "true");

					const ua = navigator.userAgent || "";
					const platform = /Mac|iPhone|iPad/i.test(ua) ? "mac" : "other";
					doc.setAttribute("data-platform", platform);

					performance.mark("pondAppStart");
				} catch {
					/* bundle will paint */
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
