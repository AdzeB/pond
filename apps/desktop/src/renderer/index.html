<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self' pond:; img-src 'self' data: blob: pond: https:; media-src 'self' data: blob: pond: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob: pond: http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:* https:; font-src 'self' data:"
		/>
		<title>Pond</title>
		<link
			rel="preload"
			href="/src/assets/fonts/inter/variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<link
			rel="preload"
			href="/src/assets/fonts/jetbrains-mono/latin-600-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<style>
			/* Pre-bundle shell paint. Resolved tokens that mirror
			   @pond/theme so the very first frame already
			   looks like Pond before main.tsx parses. */
			:root {
				font-family:
					inter-variable, ui-sans-serif, system-ui, -apple-system,
					"SF Pro Text", "Segoe UI", sans-serif;
				color-scheme: light dark;
			}
			html[data-theme="light"] {
				color: #1a1a1a;
				color-scheme: light;
				background: #ffffff;
			}
			html[data-theme="dark"] {
				color: #ededed;
				color-scheme: dark;
				background: #000000;
			}
			html[data-shell-backdrop="native"],
			html[data-shell-backdrop="native"] body,
			html[data-shell-backdrop="native"] #root {
				background: transparent;
			}
			html,
			body {
				height: 100%;
				margin: 0;
				overflow: hidden;
				overscroll-behavior: none;
			}
			#root {
				display: flex;
				flex-direction: column;
				height: 100%;
				isolation: isolate;
			}
			/* Instant launch cover; BootScreen removes it once the pool is ready. */
			#boot {
				position: fixed;
				inset: 0;
				z-index: 200;
				display: grid;
				place-items: center;
				-webkit-user-select: none;
				user-select: none;
				background: #ffffff;
				opacity: 1;
				transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1);
			}
			html[data-theme="dark"] #boot {
				background: #000000;
			}
			#boot[data-state="out"] {
				pointer-events: none;
				opacity: 0;
			}
			#boot .boot-drag {
				position: absolute;
				top: 0;
				right: 0;
				left: 0;
				height: 44px;
				-webkit-app-region: drag;
			}
			#boot .boot-mark {
				position: relative;
				display: block;
				width: 40px;
				height: 40px;
				background: #1a1a1a;
				border-radius: 9999px;
			}
			html[data-theme="dark"] #boot .boot-mark {
				background: #ededed;
			}
			#boot .boot-ring {
				position: absolute;
				inset: 9px;
				border: 2px solid #ffffff;
				border-radius: 9999px;
			}
			html[data-theme="dark"] #boot .boot-ring {
				border-color: #000000;
			}
			@media (prefers-reduced-motion: reduce) {
				#boot {
					transition: none;
				}
			}
		</style>
		<script>
			(() => {
				try {
					const hint = window.__pondShell || {};
					// Appearance is per-pond; mirror key matches theme-applier's
					// pondScopedKey("pondShell").
					let pondId = "unbound";
					try {
						pondId = window.pond.pondId();
					} catch {}
					const raw = localStorage.getItem(`pondShell:${pondId}`);
					const stored = raw ? JSON.parse(raw) : {};
					const shell = { ...stored, ...hint };
					const doc = document.documentElement;

					let theme = shell.theme;
					if (theme !== "light" && theme !== "dark") {
						theme = window.matchMedia("(prefers-color-scheme: dark)").matches
							? "dark"
							: "light";
					}
					doc.setAttribute("data-theme", theme);
					doc.classList.add(theme);

					const setNum = (key, prop) => {
						if (typeof shell[key] === "number")
							doc.style.setProperty(prop, String(shell[key]));
					};
					setNum("baseL", "--ds-base-l");
					setNum("baseC", "--ds-base-c");
					setNum("baseH", "--ds-base-h");
					setNum("accentL", "--ds-accent-l");
					setNum("accentC", "--ds-accent-c");
					setNum("accentH", "--ds-accent-h");
					setNum("contrast", "--ds-contrast");
					setNum("fgDir", "--ds-fg-dir");

					if (shell.pointerCursors)
						doc.setAttribute("data-pointer-cursors", "true");

					if (shell.shellBackdropCapable)
						doc.setAttribute("data-shell-backdrop-capable", "");
					if (shell.shellBackdrop)
						doc.setAttribute("data-shell-backdrop", "native");
					if (shell.reduceTransparency)
						doc.setAttribute("data-reduce-transparency", "true");

					const ua = navigator.userAgent || "";
					const platform = /Mac|iPhone|iPad/i.test(ua) ? "mac" : "other";
					doc.setAttribute("data-platform", platform);

					performance.mark("pondAppStart");
				} catch {
					/* bundle will paint */
				}
			})();
		</script>
	</head>
	<body>
		<div id="boot" role="status" aria-busy="true" aria-label="Loading Pond">
			<div class="boot-drag" aria-hidden="true"></div>
			<span class="boot-mark" aria-hidden="true">
				<span class="boot-ring"></span>
			</span>
		</div>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
