<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Pond brand hero · light</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body.light { --ink:#1a1a1c; --ink2:#6b6b70; --ink3:#9b9ba0; --panel:#fff; --line:rgba(0,0,0,.07); --hair:rgba(0,0,0,.055); --hov:rgba(0,0,0,.02);
  --ok:#3c9a52; --okdim:rgba(60,154,82,.12); --warn:#b57e1c; --warndim:rgba(181,126,28,.12); --err:#cf3f3f; --run:#4472d4; --rundim:rgba(68,114,212,.10); color: #1a1a1c; background: #fafafa; }
body.dark { --ink:#ececee; --ink2:#8a8a90; --ink3:#5b5b61; --panel:#121214; --line:rgba(255,255,255,.07); --hair:rgba(255,255,255,.05); --hov:rgba(255,255,255,.02);
  --ok:#4ade80; --okdim:rgba(74,222,128,.13); --warn:#fbbf24; --warndim:rgba(251,191,36,.12); --err:#f87171; --run:#7dd3fc; --rundim:rgba(125,211,252,.12); color: #ececee; background: #0c0c0d; }
.chip { display:inline-block; flex:none; overflow:hidden; vertical-align:middle; background:#fff; box-shadow:0 0 0 1px var(--hair); }
.chip img { display:block; width:100%; height:100%; }
.dot { flex:none; width:6px; height:6px; background:var(--ok); border-radius:50%; }
.dot.run { background:var(--run); } .dot.warn { background:var(--warn); } .dot.err { background:var(--err); }
.badge { display:inline-block; padding:2px 7px; font-size:11px; font-weight:600; border-radius:5px; }
.badge.ok { color:var(--ok); background:var(--okdim); } .badge.warn { color:var(--warn); background:var(--warndim); } .badge.run { color:var(--run); background:var(--rundim); }
.btn { padding:5px 12px; font:inherit; font-size:12.5px; font-weight:550; color:var(--ink); cursor:pointer; background:var(--panel); border:0; border-radius:7px; box-shadow:0 0 0 1px var(--line); }
.btn.primary { color:var(--panel); background:var(--ink); box-shadow:none; }
.panel { background:var(--panel); border-radius:12px; box-shadow:0 0 0 1px var(--hair), 0 1px 3px rgba(0,0,0,.03); }
.ticks { display:flex; gap:2.5px; align-items:flex-end; height:22px; }
.ticks i { flex:1; min-height:4px; background:var(--ok); border-radius:1.5px; opacity:.8; }
.ticks i.z { height:4px; background:var(--hair); }
.ticks i.w { background:var(--warn); }
.num { font-variant-numeric: tabular-nums; }
.st { font-size:10.5px; font-weight:700; letter-spacing:.07em; }
.st.ok { color:var(--ok); } .st.warn { color:var(--warn); } .st.err { color:var(--err); } .st.run { color:var(--run); }

.hero { position:relative; padding:64px 32px 90px; overflow:hidden;text-align:center; 
  background: radial-gradient(ellipse 90% 120% at 50% -20%, rgba(110,110,224,.14), transparent 60%),
              radial-gradient(ellipse 70% 90% at 80% 0%, rgba(60,154,82,.10), transparent 55%); }
.ripple { position:absolute; top:38px; left:50%; width:340px; height:340px; pointer-events:none; transform:translateX(-50%); }
.ripple i { position:absolute; inset:0; border:1px solid var(--line); border-radius:50%; }
.ripple i:nth-child(2) { inset:40px; } .ripple i:nth-child(3) { inset:80px; } .ripple i:nth-child(4) { inset:120px; }
h1 { position:relative; font-size:15px; font-weight:600; color:var(--ink2); }
.big { position:relative; margin-top:14px; font-size:64px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.045em; }
.sub { position:relative; margin-top:6px; font-size:13.5px; color:var(--ink2); } .sub b { font-weight:650; color:var(--ok); }
.wrap { position:relative; max-width:640px; padding:0 32px 80px; margin:-30px auto 0; }
.rows { overflow:hidden; }
.row { display:flex; gap:12px; align-items:center; padding:12px 16px; background:var(--panel); border-top:1px solid var(--hair); }
.row:first-child { border-top:0; }
.rname { flex:1; font-size:13px; font-weight:550; } .rstate { font-size:12px; }
.rr { font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--ink3); } .rr b { font-weight:600; color:var(--ink); }
.actions { display:flex; gap:8px; justify-content:center; margin-top:18px; }</style></head>
<body class="light"><div class="hero">
    <div class="ripple"><i></i><i></i><i></i><i></i></div>
    <h1>◍ Your pond</h1><div class="big">5,056</div>
    <div class="sub"><b>+12 today</b> · 7 sources flowing in · everything healthy</div></div>
  <div class="wrap"><div class="rows panel">
    <div class="row"><span class="chip" style="width:22px;height:22px;border-radius:6px"><img src="twitter.svg" alt=""/></span><span class="rname">Twitter</span>
    <span class="rstate">Synced <span style="color:var(--ink3)">18m ago</span></span><span class="rr"><b>2,381</b></span></div>
    <div class="row"><span class="chip" style="width:22px;height:22px;border-radius:6px"><img src="cosmos.svg" alt=""/></span><span class="rname">Cosmos</span>
    <span class="rstate"><span style="color:var(--run);font-weight:550">Syncing</span> <span style="color:var(--ink3)">· 12 new</span></span><span class="rr"><b>312</b></span></div>
    <div class="row"><span class="chip" style="width:22px;height:22px;border-radius:6px"><img src="pinterest.svg" alt=""/></span><span class="rname">Pinterest</span>
    <span class="rstate"><span style="color:var(--warn);font-weight:550">Rate limited</span> <span style="color:var(--ink3)">· resumes 1:20</span></span><span class="rr"><b>1,104</b></span></div>
    <div class="row"><span class="chip" style="width:22px;height:22px;border-radius:6px"><img src="instagram.svg" alt=""/></span><span class="rname">Instagram</span>
    <span class="rstate">Synced <span style="color:var(--ink3)">1h ago</span></span><span class="rr"><b>694</b></span></div>
    <div class="row"><span class="chip" style="width:22px;height:22px;border-radius:6px"><img src="arena.svg" alt=""/></span><span class="rname">Are.na</span>
    <span class="rstate">Synced <span style="color:var(--ink3)">2h ago</span></span><span class="rr"><b>245</b></span></div>
    <div class="row"><span class="chip" style="width:22px;height:22px;border-radius:6px"><img src="tiktok.svg" alt=""/></span><span class="rname">TikTok</span>
    <span class="rstate">Synced <span style="color:var(--ink3)">3h ago</span></span><span class="rr"><b>188</b></span></div>
    <div class="row"><span class="chip" style="width:22px;height:22px;border-radius:6px"><img src="youtube.svg" alt=""/></span><span class="rname">YouTube</span>
    <span class="rstate">Synced <span style="color:var(--ink3)">5h ago</span></span><span class="rr"><b>132</b></span></div></div>
    <div class="actions"><button class="btn primary">Sync all</button><button class="btn">Add source</button></div></div></body></html>
