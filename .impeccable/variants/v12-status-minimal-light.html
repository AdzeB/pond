<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Status page · minimal rows</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body.light { --ink:#1a1a1c; --ink2:#6b6b70; --ink3:#9b9ba0; --panel:#fff; --line:rgba(0,0,0,.07); --hair:rgba(0,0,0,.055); --hov:rgba(0,0,0,.02);
  --ok:#3c9a52; --okdim:rgba(60,154,82,.12); --warn:#b57e1c; --warndim:rgba(181,126,28,.12); --err:#cf3f3f; --run:#4472d4; --rundim:rgba(68,114,212,.10); color: #1a1a1c; background: #fafafa; }
body.dark { --ink:#ececee; --ink2:#8a8a90; --ink3:#5b5b61; --panel:#121214; --line:rgba(255,255,255,.07); --hair:rgba(255,255,255,.05); --hov:rgba(255,255,255,.02);
  --ok:#4ade80; --okdim:rgba(74,222,128,.13); --warn:#fbbf24; --warndim:rgba(251,191,36,.12); --err:#f87171; --run:#7dd3fc; --rundim:rgba(125,211,252,.12); color: #ececee; background: #0c0c0d; }
.chip { display:inline-block; flex:none; overflow:hidden; vertical-align:middle; background:#fff; box-shadow:0 0 0 1px var(--hair); }
.chip img { display:block; width:100%; height:100%; }
.dot { flex:none; width:6px; height:6px; background:var(--ok); border-radius:50%; }
.dot.run { background:var(--run); } .dot.warn { background:var(--warn); } .dot.err { background:var(--err); }
.badge { display:inline-block; padding:2px 7px; font-size:11px; font-weight:600; border-radius:5px; }
.badge.ok { color:var(--ok); background:var(--okdim); } .badge.warn { color:var(--warn); background:var(--warndim); } .badge.run { color:var(--run); background:var(--rundim); }
.btn { padding:5px 12px; font:inherit; font-size:12.5px; font-weight:550; color:var(--ink); cursor:pointer; background:var(--panel); border:0; border-radius:7px; box-shadow:0 0 0 1px var(--line); }
.btn.primary { color:var(--panel); background:var(--ink); box-shadow:none; }
.panel { background:var(--panel); border-radius:12px; box-shadow:0 0 0 1px var(--hair), 0 1px 3px rgba(0,0,0,.03); }
.ticks { display:flex; gap:2.5px; align-items:flex-end; height:22px; }
.ticks i { flex:1; min-height:4px; background:var(--ok); border-radius:1.5px; opacity:.8; }
.ticks i.z { height:4px; background:var(--hair); }
.ticks i.w { background:var(--warn); }
.num { font-variant-numeric: tabular-nums; }
.st { font-size:10.5px; font-weight:700; letter-spacing:.07em; }
.st.ok { color:var(--ok); } .st.warn { color:var(--warn); } .st.err { color:var(--err); } .st.run { color:var(--run); }

.wrap { display:flex; flex-direction:column; gap:20px; max-width: 640px; padding: 44px 32px 80px; margin: 0 auto; }
.top { display:flex; gap:8px; align-items:center; } .top h1 { flex:1; font-size:14px; font-weight:600; color:var(--ink2); }
.verdict { display:flex; flex-direction:column; gap:9px; align-items:center; padding:22px 0 8px; text-align:center; }
.glyph { display:grid; place-items:center; width:42px; height:42px; font-size:18px; color:var(--ok); background:var(--okdim); border-radius:50%; }
.vt { font-size:19px; font-weight:650; letter-spacing:-.02em; } .vs { font-size:12.5px; color:var(--ink2); } .vs b { font-weight:600; color:var(--ink); }
.src { padding:12px 16px 13px; border-top:1px solid var(--hair); } .src:first-child { border-top:0; }
.srct { display:flex; gap:10px; align-items:center; } .name { flex:1; font-size:13px; font-weight:550; }
.state { font-size:12px; color:var(--ink3); }
.panel-head { display:flex; padding:11px 16px; font-size:12px; font-weight:600; color:var(--ink2); border-bottom:1px solid var(--hair); }
.panel-head span:last-child { margin-left:auto; font-size:11.5px; font-weight:400; color:var(--ink3); }
.ticks { margin:9px 0 0 32px; } .foot { display:flex; margin:5px 0 0 32px; font-size:10.5px; color:var(--ink3); } .foot span:last-child { margin-left:auto; }
.spark { margin-left:auto; }</style></head>
<body class="light"><div class="wrap">
    <div class="top"><h1>Sources</h1><button class="btn">Pause all</button><button class="btn primary">Sync all</button></div>
    <div class="verdict"><span class="glyph">✓</span><div class="vt">Your pond is healthy</div>
    <div class="vs"><b>5,056</b> items from 7 sources · <b>12</b> new today · last run 2 minutes ago</div></div>
    <div class="panel">
    <div class="src">
      <div class="srct"><span class="chip" style="width:24px;height:24px;border-radius:6px"><img src="twitter.svg" alt=""/></span><span class="name">Twitter</span>
      
      <span class="state">Synced <span style="color:var(--ink3)">18m ago</span></span></div>
      
    </div>
    <div class="src">
      <div class="srct"><span class="chip" style="width:24px;height:24px;border-radius:6px"><img src="cosmos.svg" alt=""/></span><span class="name">Cosmos</span>
      
      <span class="state"><span style="color:var(--run);font-weight:550">Syncing</span> <span style="color:var(--ink3)">· 12 new</span></span></div>
      
    </div>
    <div class="src">
      <div class="srct"><span class="chip" style="width:24px;height:24px;border-radius:6px"><img src="pinterest.svg" alt=""/></span><span class="name">Pinterest</span>
      
      <span class="state"><span style="color:var(--warn);font-weight:550">Rate limited</span> <span style="color:var(--ink3)">· resumes 1:20</span></span></div>
      
    </div>
    <div class="src">
      <div class="srct"><span class="chip" style="width:24px;height:24px;border-radius:6px"><img src="instagram.svg" alt=""/></span><span class="name">Instagram</span>
      
      <span class="state">Synced <span style="color:var(--ink3)">1h ago</span></span></div>
      
    </div>
    <div class="src">
      <div class="srct"><span class="chip" style="width:24px;height:24px;border-radius:6px"><img src="arena.svg" alt=""/></span><span class="name">Are.na</span>
      
      <span class="state">Synced <span style="color:var(--ink3)">2h ago</span></span></div>
      
    </div>
    <div class="src">
      <div class="srct"><span class="chip" style="width:24px;height:24px;border-radius:6px"><img src="tiktok.svg" alt=""/></span><span class="name">TikTok</span>
      
      <span class="state">Synced <span style="color:var(--ink3)">3h ago</span></span></div>
      
    </div>
    <div class="src">
      <div class="srct"><span class="chip" style="width:24px;height:24px;border-radius:6px"><img src="youtube.svg" alt=""/></span><span class="name">YouTube</span>
      
      <span class="state">Synced <span style="color:var(--ink3)">5h ago</span></span></div>
      
    </div></div>
  </div></body></html>
