<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sources — Paused</title>
<link rel="stylesheet" href="states.css" />
</head>
<body>
<div class="content">
  <header>
    <div class="heading">
      <h1>Sources</h1>
      <p class="subtitle">7 connected · paused</p>
    </div>
    <div class="actions">
      <button class="btn primary">Resume all</button>
    </div>
  </header>

  <div class="health">
    <span class="health-glyph pause">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M5.5 3v10M10.5 3v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </span>
    <div class="health-text">
      <div class="health-title">Syncing is paused</div>
      <div class="health-sub">Nothing will run until you resume · last run 40 minutes ago</div>
    </div>
  </div>

  <section>
    <div class="section-head"><span class="section-label">Connected</span></div>
    <div class="grid">
      <div class="tile muted"><span class="brand"><img src="twitter.svg" alt=""/></span><span class="tile-name">Twitter</span><span class="tile-status">40m ago</span></div>
      <div class="tile muted"><span class="brand"><img src="instagram.svg" alt=""/></span><span class="tile-name">Instagram</span><span class="tile-status">1h ago</span></div>
      <div class="tile muted"><span class="brand"><img src="pinterest.svg" alt=""/></span><span class="tile-name">Pinterest</span><span class="tile-status">2h ago</span></div>
      <div class="tile muted"><span class="brand"><img src="arena.svg" alt=""/></span><span class="tile-name">Are.na</span><span class="tile-status">2h ago</span></div>
      <div class="tile muted"><span class="brand"><img src="cosmos.svg" alt=""/></span><span class="tile-name">Cosmos</span><span class="tile-status">1h ago</span></div>
      <div class="tile muted"><span class="brand"><img src="tiktok.svg" alt=""/></span><span class="tile-name">TikTok</span><span class="tile-status">3h ago</span></div>
      <div class="tile muted"><span class="brand"><img src="youtube.svg" alt=""/></span><span class="tile-name">YouTube</span><span class="tile-status">5h ago</span></div>
    </div>
  </section>
</div>
</body>
</html>
