<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sources — First sync</title>
<link rel="stylesheet" href="states.css" />
</head>
<body>
<div class="content">
  <header>
    <div class="heading">
      <h1>Sources</h1>
      <p class="subtitle">1 connected · first sync running</p>
    </div>
    <div class="actions">
      <button class="btn">Pause</button>
    </div>
  </header>

  <div class="health">
    <span class="health-glyph run">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.5v3h-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <div class="health-text">
      <div class="health-title">First sync running</div>
      <div class="health-sub">Pulling in your Twitter bookmarks — <b>128</b> items so far</div>
      <div class="health-track"><span class="health-fill"></span></div>
    </div>
  </div>

  <section>
    <div class="section-head"><span class="section-label">Connected</span></div>
    <div class="grid">
      <div class="tile"><span class="brand"><img src="twitter.svg" alt=""/><span class="ring"></span><span class="badge">128</span></span><span class="tile-name">Twitter</span><span class="tile-status run">syncing</span></div>
    </div>
  </section>

  <section>
    <div class="section-head"><span class="section-label">Available</span></div>
    <div class="avail">
      <span class="avail-chip"><span class="avail-brand"><img src="instagram.svg" alt=""/></span>Instagram<span class="plus">+</span></span>
      <span class="avail-chip"><span class="avail-brand"><img src="pinterest.svg" alt=""/></span>Pinterest<span class="plus">+</span></span>
      <span class="avail-chip"><span class="avail-brand"><img src="arena.svg" alt=""/></span>Are.na<span class="plus">+</span></span>
      <span class="avail-chip"><span class="avail-brand"><img src="cosmos.svg" alt=""/></span>Cosmos<span class="plus">+</span></span>
      <span class="avail-chip"><span class="avail-brand"><img src="tiktok.svg" alt=""/></span>TikTok<span class="plus">+</span></span>
      <span class="avail-chip"><span class="avail-brand"><img src="youtube.svg" alt=""/></span>YouTube<span class="plus">+</span></span>
      <span class="avail-chip"><span class="avail-brand"><img src="reddit.svg" alt=""/></span>Reddit<span class="plus">+</span></span>
      <span class="avail-chip"><span class="avail-brand"><img src="threads.svg" alt=""/></span>Threads<span class="plus">+</span></span>
    </div>
  </section>
</div>
</body>
</html>
