<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ED8 — Anchored popover (Notion style)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    padding: 36px 40px;
    font: 13px/1.45 -apple-system, "SF Pro Text", Inter, sans-serif;color: #1b1b1a; 
    background: #fbfbfa;
  }

  .page-head { display: flex; gap: 14px; align-items: baseline; margin-bottom: 22px; }
  .page-head h1 { font-size: 17px; font-weight: 640; letter-spacing: -.01em; }
  .page-head span { font-size: 12px; color: #8a8a86; }

  .grid { position: relative; display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 980px; }
  .card {
    padding: 13px 15px; 
    background: #fff; border: 1px solid #e7e7e5; border-radius: 12px;box-shadow: 0 1px 3px rgba(20,20,19,.04);
  }
  .card b { display: block; margin-bottom: 10px; font-size: 12.5px; font-weight: 600; }
  .card.editing { position: relative; outline: 2px solid #1b1b1a; outline-offset: -1px; }
  .metric { font-size: 26px; font-weight: 640; letter-spacing: -.02em; }
  .metric-sub { margin-top: 2px; font-size: 11.5px; color: #8a8a86; }
  svg { display: block; }
  .legend { display: flex; gap: 12px; margin-top: 9px; font-size: 10.5px; color: #6f6f6c; }
  .legend i { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 2px; }

  /* anchored popover */
  .popover {
    position: absolute; top: 8px; left: calc(50% + 8px); z-index: 5;
    width: 300px; 
    padding: 6px;background: #fff; border: 1px solid #e7e7e5; border-radius: 12px;
    box-shadow: 0 16px 48px rgba(20,20,19,.16), 0 2px 8px rgba(20,20,19,.06);
  }
  .pop-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 8px; }
  .pop-head b { font-size: 12.5px; font-weight: 600; }
  .pop-head .x { font-size: 11px; color: #b3b3af; cursor: pointer; }

  .pop-name {
    width: 100%; padding: 6px 8px; margin-bottom: 4px;
    font-family: inherit; font-size: 12.5px; font-weight: 500; color: #1b1b1a;outline: none;
    background: #f4f4f3; border: none; border-radius: 8px;
  }
  .pop-name::placeholder { color: #9c9c98; }

  .icon-row { display: flex; gap: 3px; padding: 6px 4px 8px; border-bottom: 1px solid #f0f0ee; }
  .icon-row button {
    display: grid; 
    flex: 1; place-items: center; height: 34px;color: #8a8a86; cursor: pointer;
    background: none; border: none; border-radius: 8px;
  }
  .icon-row button:hover { background: #f4f4f3; }
  .icon-row button.on { color: #1b1b1a; background: #f0f0ee; box-shadow: inset 0 0 0 1px #d9d9d6; }
  .icon-row button:disabled { opacity: .3; }

  .rows { padding: 4px 0; }
  .row {
    display: flex; gap: 8px;align-items: center; 
    min-height: 32px; padding: 0 8px; cursor: pointer;border-radius: 8px;
  }
  .row:hover { background: #f7f7f6; }
  .row .ico { flex: none; width: 16px; font-size: 12px; color: #b3b3af; text-align: center; }
  .row .key { font-size: 12.5px; color: #1b1b1a; }
  .row .val { display: inline-flex; gap: 4px; align-items: center; margin-left: auto; font-size: 12px; color: #8a8a86; }
  .row .val .chev { font-size: 9px; color: #c9c9c5; }
  .rows + .rows { border-top: 1px solid #f0f0ee; }

  .pop-foot { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #f0f0ee; }
  .pop-foot button { flex: 1; padding: 7px 0; font: inherit; font-size: 12.5px; cursor: pointer; border-radius: 8px; }
  .ghost { color: #55554f; background: #fff; border: 1px solid #e0e0dd; }
  .primary { font-weight: 550; color: #fff; background: #1b1b1a; border: 0; }
</style>
</head>
<body>

<div class="page-head"><h1>Overview</h1><span>Last 30 days</span></div>

<div class="grid">
  <div class="card editing">
    <b>Saves by day, split by source</b>
    <svg width="100%" height="110" viewBox="0 0 440 110" preserveAspectRatio="none">
      <defs>
        <linearGradient id="n1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0797b9" stop-opacity=".32"/><stop offset="1" stop-color="#0797b9" stop-opacity=".02"/></linearGradient>
        <linearGradient id="n2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5b5bd6" stop-opacity=".28"/><stop offset="1" stop-color="#5b5bd6" stop-opacity=".02"/></linearGradient>
      </defs>
      <path d="M0 80 C55 74 75 46 120 52 C165 58 200 28 245 34 C290 40 320 20 365 16 C400 13 425 22 440 14 L440 110 L0 110 Z" fill="url(#n1)"/>
      <path d="M0 80 C55 74 75 46 120 52 C165 58 200 28 245 34 C290 40 320 20 365 16 C400 13 425 22 440 14" fill="none" stroke="#0797b9" stroke-width="1.75"/>
      <path d="M0 96 C65 92 105 82 155 86 C205 90 265 74 315 78 C365 82 420 70 440 72 L440 110 L0 110 Z" fill="url(#n2)"/>
      <path d="M0 96 C65 92 105 82 155 86 C205 90 265 74 315 78 C365 82 420 70 440 72" fill="none" stroke="#5b5bd6" stroke-width="1.75"/>
    </svg>
    <div class="legend">
      <span><i style="background:#0797b9"></i>Twitter</span>
      <span><i style="background:#5b5bd6"></i>Cosmos</span>
      <span><i style="background:#ab4aba"></i>Instagram</span>
    </div>
  </div>

  <div class="card" style="opacity:.5;">
    <b>Success rate</b>
    <div class="metric">94%</div>
    <div class="metric-sub">212 runs · last 30 days</div>
  </div>
  <div class="card" style="opacity:.5;">
    <b>Runs by outcome</b>
    <svg width="100%" height="90" viewBox="0 0 440 90" preserveAspectRatio="none">
      <g fill="#d9d9d6"><rect x="20" y="26" width="36" height="64" rx="3"/><rect x="84" y="46" width="36" height="44" rx="3"/><rect x="148" y="60" width="36" height="30" rx="3"/><rect x="212" y="36" width="36" height="54" rx="3"/><rect x="276" y="68" width="36" height="22" rx="3"/><rect x="340" y="52" width="36" height="38" rx="3"/></g>
    </svg>
  </div>
  <div class="card" style="opacity:.5;">
    <b>Storage used</b>
    <div class="metric">4.2 GB</div>
    <div class="metric-sub">1,204 saves · last 30 days</div>
  </div>

  <div class="popover">
    <div class="pop-head"><b>Insight settings</b><span class="x">✕</span></div>
    <input class="pop-name" placeholder="Saves by day, split by source" />

    <div class="icon-row">
      <button aria-label="Bars"><svg width="18" height="14"><g fill="currentColor"><rect x="1" y="6" width="3" height="8" rx="1"/><rect x="6" y="2" width="3" height="12" rx="1"/><rect x="11" y="8" width="3" height="6" rx="1"/><rect x="15" y="4" width="3" height="10" rx="1"/></g></svg></button>
      <button class="on" aria-label="Area"><svg width="20" height="14"><path d="M1 10 C5 9 7 4 11 5 C15 6 17 2 19 2 L19 13 L1 13 Z" fill="currentColor" opacity=".35"/><path d="M1 10 C5 9 7 4 11 5 C15 6 17 2 19 2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button aria-label="Line"><svg width="20" height="14"><path d="M1 10 C5 9 7 4 11 5 C15 6 17 2 19 2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button aria-label="Ring"><svg width="15" height="15" viewBox="0 0 15 15"><circle cx="7.5" cy="7.5" r="5.2" fill="none" stroke="currentColor" stroke-width="2.8" opacity=".35"/><path d="M7.5 2.3 A5.2 5.2 0 0 1 12.4 5.9" fill="none" stroke="currentColor" stroke-width="2.8"/></svg></button>
      <button aria-label="Heatmap"><svg width="18" height="13"><g fill="currentColor"><rect x="1" y="1" width="4.5" height="3" rx=".8" opacity=".35"/><rect x="7" y="1" width="4.5" height="3" rx=".8" opacity=".9"/><rect x="13" y="1" width="4.5" height="3" rx=".8" opacity=".55"/><rect x="1" y="5.5" width="4.5" height="3" rx=".8" opacity=".75"/><rect x="7" y="5.5" width="4.5" height="3" rx=".8" opacity=".25"/><rect x="13" y="5.5" width="4.5" height="3" rx=".8" opacity="1"/><rect x="1" y="10" width="4.5" height="3" rx=".8" opacity=".5"/><rect x="7" y="10" width="4.5" height="3" rx=".8" opacity=".65"/><rect x="13" y="10" width="4.5" height="3" rx=".8" opacity=".2"/></g></svg></button>
      <button aria-label="Metric"><span style="font-size: 11px; font-weight: 640;">42</span></button>
      <button aria-label="Table"><svg width="16" height="13"><g fill="currentColor"><rect x="1" y="1" width="8" height="2.2" rx=".8"/><rect x="1" y="5.4" width="12" height="2.2" rx=".8"/><rect x="1" y="9.8" width="6" height="2.2" rx=".8"/></g></svg></button>
      <button disabled aria-label="Gauge"><svg width="15" height="15" viewBox="0 0 15 15"><path d="M3 12 A5.8 5.8 0 1 1 12 12" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".4"/></svg></button>
    </div>

    <div class="rows">
      <div class="row"><span class="ico">▦</span><span class="key">Data</span><span class="val">Library saves <span class="chev">▸</span></span></div>
      <div class="row"><span class="ico">#</span><span class="key">Measure</span><span class="val">Saves <span class="chev">▸</span></span></div>
    </div>
    <div class="rows">
      <div class="row"><span class="ico">⏱</span><span class="key">Slice by</span><span class="val">Day <span class="chev">▸</span></span></div>
      <div class="row"><span class="ico">⊞</span><span class="key">Segment by</span><span class="val">Source <span class="chev">▸</span></span></div>
      <div class="row"><span class="ico">≔</span><span class="key">Filters</span><span class="val">1 filter <span class="chev">▸</span></span></div>
    </div>

    <div class="pop-foot">
      <button class="ghost">Cancel</button>
      <button class="primary">Save</button>
    </div>
  </div>
</div>

</body>
</html>
