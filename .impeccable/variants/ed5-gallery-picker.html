<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ED5 — Type gallery picker (monday / Wrike style)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    display: grid; place-items: center; min-height: 100vh;padding: 32px;
    font: 13px/1.45 -apple-system, "SF Pro Text", Inter, sans-serif;color: #1b1b1a; 
    background: #e9e9e7;
  }

  .modal {
    display: flex; flex-direction: column; 
    width: 880px; height: 620px; overflow: hidden;background: #fff; border-radius: 16px;
    box-shadow: 0 32px 80px rgba(20,20,19,.22);
  }
  .modal-head {
    display: flex; gap: 12px;align-items: center; 
    padding: 14px 20px; border-bottom: 1px solid #f0f0ee;
  }
  .modal-head b { font-size: 14px; font-weight: 640; letter-spacing: -.01em; }
  .modal-head .x { margin-left: auto; color: #8a8a86; cursor: pointer; }

  .modal-main { display: flex; flex: 1; min-height: 0; }

  /* big preview left */
  .stage { display: flex; flex: 1; flex-direction: column; min-width: 0; padding: 22px 26px; }
  .stage-head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 4px; }
  .stage-head input {
    flex: 1;
    padding: 3px 6px; margin-left: -6px; 
    font-family: inherit; font-size: 15px; font-weight: 600;
    letter-spacing: -.01em; outline: 0; border: 0; border-radius: 6px;
  }
  .stage-head input:hover, .stage-head input:focus { background: #f4f4f3; }
  .stage-sub { margin-bottom: 16px; font-size: 11.5px; color: #8a8a86; }
  .plot { position: relative; flex: 1; }
  svg.chart { position: absolute; inset: 0; width: 100%; height: 100%; }
  .legend { display: flex; gap: 14px; margin-top: 12px; font-size: 11px; color: #55554f; }
  .legend i { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 2px; }
  .controls-row { display: flex; gap: 8px; margin-top: 16px; }
  .pill {
    display: inline-flex; gap: 6px;align-items: center; padding: 5px 10px;
    font-size: 12px; font-weight: 520; cursor: pointer;
    background: #f4f4f3; border-radius: 7px;
  }
  .pill .chev { font-size: 9px; color: #a3a39f; }
  .pill.chipish { font-weight: 450; background: #fff; border: 1px solid #e7e7e5; }

  /* gallery right: grouped mini previews */
  .gallery {
    flex: none; 
    width: 296px; 
    padding: 16px 18px 20px; overflow-y: auto;background: #fbfbfa;border-left: 1px solid #f0f0ee;
  }
  .g-label {
    margin: 14px 0 8px;
    font-size: 10.5px; font-weight: 600; 
    color: #9c9c98; text-transform: uppercase;letter-spacing: .04em;
  }
  .g-label:first-child { margin-top: 0; }
  .g-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .g-item {
    padding: 10px 8px 7px; 
    font-size: 10.5px; color: #6f6f6c;text-align: center; cursor: pointer;
    background: #fff; border: 1px solid #e7e7e5; border-radius: 10px;
  }
  .g-item:hover { border-color: #c9c9c5; }
  .g-item.on { font-weight: 550; color: #1b1b1a; border-color: #1b1b1a; box-shadow: 0 0 0 1px #1b1b1a inset; }
  .g-item svg { display: block; margin: 0 auto 6px; }
  .g-item.off { pointer-events: none; opacity: .35; }

  .modal-foot {
    display: flex; gap: 8px;justify-content: flex-end; 
    padding: 12px 20px; border-top: 1px solid #f0f0ee;
  }
  .primary { padding: 7px 16px; font: inherit; font-weight: 550; color: #fff; cursor: pointer; background: #1b1b1a; border: 0; border-radius: 8px; }
  .ghost { padding: 7px 14px; font: inherit; color: #55554f; cursor: pointer; background: #fff; border: 1px solid #e0e0dd; border-radius: 8px; }
</style>
</head>
<body>

<div class="modal">
  <div class="modal-head">
    <b>Edit insight</b>
    <span class="x">✕</span>
  </div>

  <div class="modal-main">
    <div class="stage">
      <div class="stage-head">
        <input value="" placeholder="Saves by day, split by source" />
        <span style="font-size: 20px; font-weight: 640; font-variant-numeric: tabular-nums;">1,204</span>
      </div>
      <div class="stage-sub">1,204 saves · last 30 days</div>
      <div class="plot">
        <svg class="chart" viewBox="0 0 520 260" preserveAspectRatio="none">
          <defs>
            <linearGradient id="q1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0797b9" stop-opacity=".3"/><stop offset="1" stop-color="#0797b9" stop-opacity=".02"/></linearGradient>
            <linearGradient id="q2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5b5bd6" stop-opacity=".26"/><stop offset="1" stop-color="#5b5bd6" stop-opacity=".02"/></linearGradient>
          </defs>
          <g stroke="#eeeeec"><line x1="0" y1="65" x2="520" y2="65"/><line x1="0" y1="130" x2="520" y2="130"/><line x1="0" y1="195" x2="520" y2="195"/></g>
          <path d="M0 190 C60 182 90 118 140 126 C190 134 230 74 290 82 C350 90 390 48 450 40 C480 36 505 46 520 36 L520 260 L0 260 Z" fill="url(#q1)"/>
          <path d="M0 190 C60 182 90 118 140 126 C190 134 230 74 290 82 C350 90 390 48 450 40 C480 36 505 46 520 36" fill="none" stroke="#0797b9" stroke-width="2"/>
          <path d="M0 228 C70 224 120 208 180 212 C240 216 310 196 370 200 C430 204 490 190 520 192 L520 260 L0 260 Z" fill="url(#q2)"/>
          <path d="M0 228 C70 224 120 208 180 212 C240 216 310 196 370 200 C430 204 490 190 520 192" fill="none" stroke="#5b5bd6" stroke-width="2"/>
        </svg>
      </div>
      <div class="legend">
        <span><i style="background:#0797b9"></i>Twitter</span>
        <span><i style="background:#5b5bd6"></i>Cosmos</span>
        <span><i style="background:#ab4aba"></i>Instagram</span>
      </div>
      <div class="controls-row">
        <span class="pill">Library saves <span class="chev">▾</span></span>
        <span class="pill">Saves <span class="chev">▾</span></span>
        <span class="pill">by Day <span class="chev">▾</span></span>
        <span class="pill">split by Source <span class="chev">▾</span></span>
        <span class="pill chipish">＋ Filter</span>
      </div>
    </div>

    <div class="gallery">
      <div class="g-label">Most used</div>
      <div class="g-grid">
        <div class="g-item on">
          <svg width="54" height="30"><path d="M2 22 C12 20 18 8 28 11 C38 14 44 4 52 5 L52 28 L2 28 Z" fill="#0797b9" opacity=".3"/><path d="M2 22 C12 20 18 8 28 11 C38 14 44 4 52 5" fill="none" stroke="#0797b9" stroke-width="1.75"/></svg>
          Area
        </div>
        <div class="g-item">
          <svg width="54" height="30"><g fill="#b9b9b5"><rect x="4" y="14" width="8" height="14" rx="2"/><rect x="16" y="6" width="8" height="22" rx="2"/><rect x="28" y="17" width="8" height="11" rx="2"/><rect x="40" y="10" width="8" height="18" rx="2"/></g></svg>
          Bars
        </div>
      </div>

      <div class="g-label">Time series</div>
      <div class="g-grid">
        <div class="g-item">
          <svg width="54" height="30"><path d="M2 22 C12 20 18 8 28 11 C38 14 44 4 52 5" fill="none" stroke="#8a8a86" stroke-width="1.75"/></svg>
          Line
        </div>
        <div class="g-item">
          <svg width="54" height="30"><g fill="#b9b9b5"><rect x="3" y="2" width="10" height="7" rx="1.5" opacity=".4"/><rect x="16" y="2" width="10" height="7" rx="1.5" opacity=".9"/><rect x="29" y="2" width="10" height="7" rx="1.5" opacity=".6"/><rect x="42" y="2" width="10" height="7" rx="1.5" opacity=".2"/><rect x="3" y="12" width="10" height="7" rx="1.5" opacity=".8"/><rect x="16" y="12" width="10" height="7" rx="1.5" opacity=".3"/><rect x="29" y="12" width="10" height="7" rx="1.5" opacity="1"/><rect x="42" y="12" width="10" height="7" rx="1.5" opacity=".5"/><rect x="3" y="22" width="10" height="7" rx="1.5" opacity=".25"/><rect x="16" y="22" width="10" height="7" rx="1.5" opacity=".7"/><rect x="29" y="22" width="10" height="7" rx="1.5" opacity=".45"/><rect x="42" y="22" width="10" height="7" rx="1.5" opacity=".85"/></g></svg>
          Heatmap
        </div>
      </div>

      <div class="g-label">Composition</div>
      <div class="g-grid">
        <div class="g-item">
          <svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="10" fill="none" stroke="#d9d9d6" stroke-width="6"/><path d="M15 5 A10 10 0 0 1 24.5 12" fill="none" stroke="#8a8a86" stroke-width="6"/></svg>
          Ring
        </div>
        <div class="g-item">
          <svg width="46" height="30"><g stroke="#e7e7e5"><line x1="2" y1="8" x2="44" y2="8"/><line x1="2" y1="16" x2="44" y2="16"/><line x1="2" y1="24" x2="44" y2="24"/></g><g fill="#8a8a86"><rect x="2" y="5" width="16" height="4" rx="1.5"/><rect x="2" y="13" width="24" height="4" rx="1.5"/><rect x="2" y="21" width="11" height="4" rx="1.5"/></g></svg>
          Table
        </div>
      </div>

      <div class="g-label">Single value</div>
      <div class="g-grid">
        <div class="g-item"><div style="font-size: 17px; font-weight: 640; margin-bottom: 5px; color: #8a8a86;">128</div>Metric</div>
        <div class="g-item off">
          <svg width="30" height="30" viewBox="0 0 30 30"><path d="M6 24 A11 11 0 1 1 24 24" fill="none" stroke="#d9d9d6" stroke-width="5"/><path d="M6 24 A11 11 0 0 1 9 9" fill="none" stroke="#8a8a86" stroke-width="5"/></svg>
          Gauge
        </div>
      </div>

      <div class="g-label">Library</div>
      <div class="g-grid">
        <div class="g-item">
          <svg width="54" height="30"><g fill="#c9c9c5"><rect x="4" y="3" width="13" height="24" rx="2.5"/><rect x="20.5" y="3" width="13" height="24" rx="2.5"/><rect x="37" y="3" width="13" height="24" rx="2.5"/></g></svg>
          Recent saves
        </div>
      </div>
    </div>
  </div>

  <div class="modal-foot">
    <button class="ghost">Cancel</button>
    <button class="primary">Save</button>
  </div>
</div>

</body>
</html>
