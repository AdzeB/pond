<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Analytics · Chart hero</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body.light { --ink:#1a1a1c; --ink2:#6b6b70; --ink3:#9b9ba0; --panel:#fff; --line:rgba(0,0,0,.07); --hair:rgba(0,0,0,.055); --hov:rgba(0,0,0,.02);
  --ok:#3c9a52; --okdim:rgba(60,154,82,.12); --warn:#b57e1c; --warndim:rgba(181,126,28,.12); --err:#cf3f3f; --run:#4472d4; --rundim:rgba(68,114,212,.10); color: #1a1a1c; background: #fafafa; }
body.dark { --ink:#ececee; --ink2:#8a8a90; --ink3:#5b5b61; --panel:#121214; --line:rgba(255,255,255,.07); --hair:rgba(255,255,255,.05); --hov:rgba(255,255,255,.02);
  --ok:#4ade80; --okdim:rgba(74,222,128,.13); --warn:#fbbf24; --warndim:rgba(251,191,36,.12); --err:#f87171; --run:#7dd3fc; --rundim:rgba(125,211,252,.12); color: #ececee; background: #0c0c0d; }
.chip { display:inline-block; flex:none; overflow:hidden; vertical-align:middle; background:#fff; box-shadow:0 0 0 1px var(--hair); }
.chip img { display:block; width:100%; height:100%; }
.dot { flex:none; width:6px; height:6px; background:var(--ok); border-radius:50%; }
.dot.run { background:var(--run); } .dot.warn { background:var(--warn); } .dot.err { background:var(--err); }
.badge { display:inline-block; padding:2px 7px; font-size:11px; font-weight:600; border-radius:5px; }
.badge.ok { color:var(--ok); background:var(--okdim); } .badge.warn { color:var(--warn); background:var(--warndim); } .badge.run { color:var(--run); background:var(--rundim); }
.btn { padding:5px 12px; font:inherit; font-size:12.5px; font-weight:550; color:var(--ink); cursor:pointer; background:var(--panel); border:0; border-radius:7px; box-shadow:0 0 0 1px var(--line); }
.btn.primary { color:var(--panel); background:var(--ink); box-shadow:none; }
.panel { background:var(--panel); border-radius:12px; box-shadow:0 0 0 1px var(--hair), 0 1px 3px rgba(0,0,0,.03); }
.ticks { display:flex; gap:2.5px; align-items:flex-end; height:22px; }
.ticks i { flex:1; min-height:4px; background:var(--ok); border-radius:1.5px; opacity:.8; }
.ticks i.z { height:4px; background:var(--hair); }
.ticks i.w { background:var(--warn); }
.num { font-variant-numeric: tabular-nums; }
.st { font-size:10.5px; font-weight:700; letter-spacing:.07em; }
.st.ok { color:var(--ok); } .st.warn { color:var(--warn); } .st.err { color:var(--err); } .st.run { color:var(--run); }

.wrap { display:flex; flex-direction:column; gap:12px; max-width: 880px; padding: 32px 32px 80px; margin: 0 auto; }
.top { display:flex; gap:10px; align-items:center; } .top h1 { flex:1; font-size:16px; font-weight:650; }
.range { padding:4px 10px; font-size:12px; color:var(--ink2); background:var(--panel); border-radius:6px; box-shadow:0 0 0 1px var(--line); }
.hero { padding:0; overflow:hidden; }
.ktabs { display:flex; border-bottom:1px solid var(--hair); }
.ktab { flex:1; max-width:180px; padding:12px 18px 11px; cursor:default; border-right:1px solid var(--hair); }
.ktab.on { box-shadow:inset 0 -2px 0 var(--ink); }
.ktab .l { font-size:11.5px; color:var(--ink2); } .ktab .v { margin-top:1px; font-size:19px; font-weight:640; letter-spacing:-.01em; }
.chart { padding:18px 16px 4px; } .chart svg { display:block; width:100%; height:150px; }
.axis { display:flex; justify-content:space-between; padding:6px 16px 12px; font-size:10.5px; color:var(--ink3); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.panel { padding:0; }
.ph { display:flex; gap:14px; align-items:center; padding:10px 14px 0; }
.tab { padding-bottom:8px; font-size:12px; font-weight:600; border-bottom:2px solid var(--ink); }
.tab.off { font-weight:500; color:var(--ink3); border-bottom-color:transparent; }
.body { padding:6px 8px 8px; border-top:1px solid var(--hair); }
.row { display:flex; gap:8px; align-items:center; height:29px; padding:0 8px; font-size:12.5px; border-radius:5px; }
.row:hover { background:var(--hov); }
.row .name { flex:1; } .row .val { font-weight:550; font-variant-numeric:tabular-nums; }
.track { width:60px; height:6px; overflow:hidden; background:var(--hair); border-radius:2px; }
.track i { display:block; height:100%; background:rgba(0,0,0,.22); }
</style></head>
<body class="light"><div class="wrap">
    <div class="top"><h1>Analytics</h1><span class="range">Last 7 days</span></div>
    <div class="panel hero">
      <div class="ktabs">
        <div class="ktab on"><div class="l">Items synced</div><div class="v num">1,284</div></div>
        <div class="ktab"><div class="l">Runs</div><div class="v num">96</div></div>
        <div class="ktab"><div class="l">Success rate</div><div class="v num">94%</div></div>
        <div class="ktab"><div class="l">Avg duration</div><div class="v num">42s</div></div>
      </div>
      <div class="chart"><svg class="area" viewBox="0 0 800 150" fill="none" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4472d4" stop-opacity="0.14"/><stop offset="100%" stop-color="#4472d4" stop-opacity="0"/></linearGradient></defs>
    <path d="M0 131 L50 128 L100 120 L150 110 L200 111 L250 99 L300 93 L350 85 L400 78 L450 69 L500 61 L550 58 L600 45 L650 41 L700 35 L750 31 L800 19 L800 150 L0 150 Z" fill="url(#ag)"/><path d="M0 131 L50 128 L100 120 L150 110 L200 111 L250 99 L300 93 L350 85 L400 78 L450 69 L500 61 L550 58 L600 45 L650 41 L700 35 L750 31 L800 19" stroke="#4472d4" stroke-width="1.5"/></svg></div>
      <div class="axis"><span>Jun 30</span><span>Jul 1</span><span>Jul 2</span><span>Jul 3</span><span>Jul 4</span><span>Jul 5</span><span>Jul 6</span><span>Today</span></div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="ph"><span class="tab">Sources</span><span class="tab off">Runs</span><span class="tab off">Duration</span></div>
        <div class="body"><div class="row"><span class="chip" style="width:17px;height:17px;border-radius:5px"><img src="twitter.svg" alt=""/></span><span class="name">Twitter</span><span class="val">412</span><span class="track"><i style="width:100%"></i></span></div><div class="row"><span class="chip" style="width:17px;height:17px;border-radius:5px"><img src="pinterest.svg" alt=""/></span><span class="name">Pinterest</span><span class="val">288</span><span class="track"><i style="width:70%"></i></span></div><div class="row"><span class="chip" style="width:17px;height:17px;border-radius:5px"><img src="instagram.svg" alt=""/></span><span class="name">Instagram</span><span class="val">154</span><span class="track"><i style="width:37%"></i></span></div><div class="row"><span class="chip" style="width:17px;height:17px;border-radius:5px"><img src="cosmos.svg" alt=""/></span><span class="name">Cosmos</span><span class="val">121</span><span class="track"><i style="width:29%"></i></span></div><div class="row"><span class="chip" style="width:17px;height:17px;border-radius:5px"><img src="arena.svg" alt=""/></span><span class="name">Are.na</span><span class="val">58</span><span class="track"><i style="width:14%"></i></span></div><div class="row"><span class="chip" style="width:17px;height:17px;border-radius:5px"><img src="tiktok.svg" alt=""/></span><span class="name">TikTok</span><span class="val">31</span><span class="track"><i style="width:8%"></i></span></div></div></div>
      <div class="panel"><div class="ph"><span class="tab">Outcomes</span><span class="tab off">Triggers</span></div>
        <div class="body"><div class="row"><span class="dot ok" style=""></span><span class="name">Completed</span><span class="val">71</span><span class="track"><i style="width:100%"></i></span></div><div class="row"><span class="dot ok" style="background:var(--ink3)"></span><span class="name">No new items</span><span class="val">14</span><span class="track"><i style="width:20%"></i></span></div><div class="row"><span class="dot warn" style=""></span><span class="name">Rate limited</span><span class="val">8</span><span class="track"><i style="width:11%"></i></span></div><div class="row"><span class="dot err" style=""></span><span class="name">Failed</span><span class="val">3</span><span class="track"><i style="width:5%"></i></span></div>
        </div></div>
    </div>
  </div></body></html>
