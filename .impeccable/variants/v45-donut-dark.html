<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Composition donut · dark</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body.light { --ink:#1a1a1c; --ink2:#6b6b70; --ink3:#9b9ba0; --panel:#fff; --line:rgba(0,0,0,.07); --hair:rgba(0,0,0,.055); --hov:rgba(0,0,0,.02);
  --ok:#3c9a52; --okdim:rgba(60,154,82,.12); --warn:#b57e1c; --warndim:rgba(181,126,28,.12); --err:#cf3f3f; --run:#4472d4; --rundim:rgba(68,114,212,.10); color: #1a1a1c; background: #fafafa; }
body.dark { --ink:#ececee; --ink2:#8a8a90; --ink3:#5b5b61; --panel:#121214; --line:rgba(255,255,255,.07); --hair:rgba(255,255,255,.05); --hov:rgba(255,255,255,.02);
  --ok:#4ade80; --okdim:rgba(74,222,128,.13); --warn:#fbbf24; --warndim:rgba(251,191,36,.12); --err:#f87171; --run:#7dd3fc; --rundim:rgba(125,211,252,.12); color: #ececee; background: #0c0c0d; }
.chip { display:inline-block; flex:none; overflow:hidden; vertical-align:middle; background:#fff; box-shadow:0 0 0 1px var(--hair); }
.chip img { display:block; width:100%; height:100%; }
.dot { flex:none; width:6px; height:6px; background:var(--ok); border-radius:50%; }
.dot.run { background:var(--run); } .dot.warn { background:var(--warn); } .dot.err { background:var(--err); }
.badge { display:inline-block; padding:2px 7px; font-size:11px; font-weight:600; border-radius:5px; }
.badge.ok { color:var(--ok); background:var(--okdim); } .badge.warn { color:var(--warn); background:var(--warndim); } .badge.run { color:var(--run); background:var(--rundim); }
.btn { padding:5px 12px; font:inherit; font-size:12.5px; font-weight:550; color:var(--ink); cursor:pointer; background:var(--panel); border:0; border-radius:7px; box-shadow:0 0 0 1px var(--line); }
.btn.primary { color:var(--panel); background:var(--ink); box-shadow:none; }
.panel { background:var(--panel); border-radius:12px; box-shadow:0 0 0 1px var(--hair), 0 1px 3px rgba(0,0,0,.03); }
.ticks { display:flex; gap:2.5px; align-items:flex-end; height:22px; }
.ticks i { flex:1; min-height:4px; background:var(--ok); border-radius:1.5px; opacity:.8; }
.ticks i.z { height:4px; background:var(--hair); }
.ticks i.w { background:var(--warn); }
.num { font-variant-numeric: tabular-nums; }
.st { font-size:10.5px; font-weight:700; letter-spacing:.07em; }
.st.ok { color:var(--ok); } .st.warn { color:var(--warn); } .st.err { color:var(--err); } .st.run { color:var(--run); }

.wrap { display:grid; grid-template-columns:300px 1fr; gap:48px; align-items:start; max-width:860px; padding:48px 32px 80px; margin:0 auto; }
.left { text-align:center; }
h1 { margin-bottom:24px; font-size:16px; font-weight:650; text-align:left; letter-spacing:-.01em; }
.donut { position:relative; width:220px; height:220px; margin:0 auto; }
.dc { position:absolute; inset:0; display:grid; flex-direction:column; place-items:center; }
.dnum { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
.dsub { margin-top:2px; font-size:11.5px; color:var(--ink3); }
.actions { display:flex; gap:8px; justify-content:center; margin-top:24px; }
.rows { padding-top:34px; }
.row { display:flex; gap:11px; align-items:center; padding:10px 0; border-top:1px solid var(--hair); }
.row:last-child { border-bottom:1px solid var(--hair); }
.swatch { flex:none; width:9px; height:9px; border-radius:3px; }
.rname { width:92px; font-size:13px; font-weight:550; } .rstate { font-size:12px; color:var(--ink2); }
.rr { margin-left:auto; font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--ink3); } .rr b { font-weight:600; color:var(--ink); }</style></head>
<body class="dark"><div class="wrap">
    <div class="left">
      <div class="donut" style="background:conic-gradient(#e8e8ec 0.0deg 169.5deg, #a5a5f0 169.5deg 191.7deg, #f2b8b8 191.7deg 270.4deg, #f0d9a8 270.4deg 319.8deg, #9adbb0 319.8deg 337.2deg, #8fd0e8 337.2deg 350.6deg, #c9c9cf 350.6deg 360.0deg); border-radius:50%;">
        <div style="position:absolute; inset:26px; background:#0c0c0d; border-radius:50%;"></div>
        <div class="dc"><div><div class="dnum">5,056</div><div class="dsub">+12 today · healthy</div></div></div>
      </div>
      <div class="actions"><button class="btn primary">Sync all</button><button class="btn">Add</button></div>
    </div>
    <div><h1>Sources</h1><div class="rows" style="padding-top:0">
    <div class="row"><span class="swatch" style="background:#e8e8ec"></span><span class="chip" style="width:20px;height:20px;border-radius:6px"><img src="twitter.svg" alt=""/></span>
    <span class="rname">Twitter</span><span class="rstate">Synced <span style="color:var(--ink3)">18m ago</span></span>
    <span class="rr">47% · <b>2,381</b></span></div>
    <div class="row"><span class="swatch" style="background:#a5a5f0"></span><span class="chip" style="width:20px;height:20px;border-radius:6px"><img src="cosmos.svg" alt=""/></span>
    <span class="rname">Cosmos</span><span class="rstate"><span style="color:var(--run);font-weight:550">Syncing</span> <span style="color:var(--ink3)">· 12 new</span></span>
    <span class="rr">6% · <b>312</b></span></div>
    <div class="row"><span class="swatch" style="background:#f2b8b8"></span><span class="chip" style="width:20px;height:20px;border-radius:6px"><img src="pinterest.svg" alt=""/></span>
    <span class="rname">Pinterest</span><span class="rstate"><span style="color:var(--warn);font-weight:550">Rate limited</span> <span style="color:var(--ink3)">· resumes 1:20</span></span>
    <span class="rr">22% · <b>1,104</b></span></div>
    <div class="row"><span class="swatch" style="background:#f0d9a8"></span><span class="chip" style="width:20px;height:20px;border-radius:6px"><img src="instagram.svg" alt=""/></span>
    <span class="rname">Instagram</span><span class="rstate">Synced <span style="color:var(--ink3)">1h ago</span></span>
    <span class="rr">14% · <b>694</b></span></div>
    <div class="row"><span class="swatch" style="background:#9adbb0"></span><span class="chip" style="width:20px;height:20px;border-radius:6px"><img src="arena.svg" alt=""/></span>
    <span class="rname">Are.na</span><span class="rstate">Synced <span style="color:var(--ink3)">2h ago</span></span>
    <span class="rr">5% · <b>245</b></span></div>
    <div class="row"><span class="swatch" style="background:#8fd0e8"></span><span class="chip" style="width:20px;height:20px;border-radius:6px"><img src="tiktok.svg" alt=""/></span>
    <span class="rname">TikTok</span><span class="rstate">Synced <span style="color:var(--ink3)">3h ago</span></span>
    <span class="rr">4% · <b>188</b></span></div>
    <div class="row"><span class="swatch" style="background:#c9c9cf"></span><span class="chip" style="width:20px;height:20px;border-radius:6px"><img src="youtube.svg" alt=""/></span>
    <span class="rname">YouTube</span><span class="rstate">Synced <span style="color:var(--ink3)">5h ago</span></span>
    <span class="rr">3% · <b>132</b></span></div></div></div>
  </div></body></html>
