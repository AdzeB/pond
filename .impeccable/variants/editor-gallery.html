<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Insight editor — 9 prototypes</title>
<style>
* { box-sizing: border-box; margin: 0; }
body {
  display: flex; flex-direction: column;
  min-height: 100vh;
  font: 400 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; color: #1a1a1c;
  background: #f4f4f5;
}
header {
  position: sticky; top: 0; z-index: 10;
  display: flex; gap: 14px; align-items: center;
  padding: 14px 22px; background: #fff; border-bottom: 1px solid rgba(0,0,0,.08);
}
header h1 { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
.counter { font-size: 12px; font-variant-numeric: tabular-nums; color: #6b6b70; }
.spacer { flex: 1; }
.nav-btn {
  display: grid; place-items: center;
  width: 30px; height: 30px;
  font-size: 14px; color: #1a1a1c; cursor: pointer;
  background: #fff; border: 0; border-radius: 7px; box-shadow: 0 0 0 1px rgba(0,0,0,.1);
}
.nav-btn:hover { background: #f4f4f5; }
.nav-btn:disabled { cursor: default; opacity: .35; }
.open-live {
  padding: 5px 12px;
  font-size: 12px; font-weight: 550; color: #1a1a1c; text-decoration: none; background: #fff; border-radius: 7px; box-shadow: 0 0 0 1px rgba(0,0,0,.1);
}
.open-live:hover { background: #f4f4f5; }
.hint { font-size: 11px; color: #9b9ba0; }

.meta { width: 100%; max-width: 1120px; padding: 18px 22px 0; margin: 0 auto; }
.meta .name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
.meta .name small { margin-right: 8px; font-size: 12px; font-weight: 500; color: #9b9ba0; }
.meta .desc { max-width: 78ch; margin-top: 3px; font-size: 12.5px; color: #55555a; }

.stage { flex: 1; width: 100%; max-width: 1120px; padding: 14px 22px 40px; margin: 0 auto; }
.frame {
  overflow: hidden;
  background: #fff; border-radius: 12px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.07), 0 2px 8px rgba(0,0,0,.05);
}
.frame iframe { display: block; width: 100%; height: 780px; border: 0; }

.dots { display: flex; gap: 6px; justify-content: center; padding: 0 0 26px; }
.dot {
  width: 26px; height: 6px; padding: 0; cursor: pointer;
  background: rgba(0,0,0,.12); border: 0; border-radius: 3px;
}
.dot:hover { background: rgba(0,0,0,.25); }
.dot.on { background: #1a1a1c; }
</style>
</head>
<body>
<header>
  <h1>Insight editor — 9 prototypes</h1>
  <span class="counter" id="counter"></span>
  <span class="spacer"></span>
  <span class="hint">← → to navigate</span>
  <a class="open-live" id="openLive" href="#" target="_blank">Open live HTML</a>
  <button class="nav-btn" id="prev" aria-label="Previous">←</button>
  <button class="nav-btn" id="next" aria-label="Next">→</button>
</header>

<div class="meta">
  <div class="name" id="name"></div>
  <div class="desc" id="desc"></div>
</div>

<div class="stage">
  <div class="frame"><iframe id="live" src="" title=""></iframe></div>
</div>

<div class="dots" id="dots"></div>

<script>
const VARIANTS = [
  { id: "ed1", file: "ed1-widget-modal.html", name: "Widget modal (Steep style)",
    desc: "A narrow centered dialog where the top section IS the card exactly as it renders on the dashboard. Settings are calm label/value rows underneath, and the display picker uses mini chart previews instead of bare icons. Closest to the current editor, smallest lift." },
  { id: "ed2", file: "ed2-sidebar-panel.html", name: "Sidebar panel (Notion / Airtable style)",
    desc: "No modal — the card being edited stays in place in the dashboard grid (highlighted, others dimmed) and updates live, while a right-hand “Insight settings” panel holds grouped sections: Data, Chart type as a labeled icon grid, Axes, Filters. Best for tweaking a card in context." },
  { id: "ed3", file: "ed3-explorer.html", name: "Full-screen explorer (Linear / Mixpanel style)",
    desc: "The editor takes over the page: big headline number with trend delta, a large readable chart, filters and time range promoted to a top bar, and a config rail on the right where unavailable displays (like Gauge for a count measure) show disabled instead of disappearing. Best for building new insights." },
  { id: "ed4", file: "ed4-form-builder.html", name: "Form-first builder (Sentry style)",
    desc: "A left form column with plain labeled fields — Title, Dataset as radios, Display, a Visualize row of measure + slice selects, Filter chips, Group by — while the live card floats over the dimmed dashboard on the right. The form reads top to bottom like a sentence; nothing is hidden behind menus." },
  { id: "ed5", file: "ed5-gallery-picker.html", name: "Type gallery picker (monday / Wrike style)",
    desc: "A wide modal where the star is a scrollable right-hand gallery of chart types, each drawn as a real mini preview and grouped by intent (Most used, Time series, Composition, Single value, Library). Data choices live as compact pills under the big preview. Best when picking the right visualization is the main decision." },
  { id: "ed6", file: "ed6-property-tokens.html", name: "Property tokens (Steep style)",
    desc: "A full-page editor with collapsible preview cards on the left and a right rail where every setting is a colored token — cyan for data, violet for display, green for grouping — so the whole config reads at a glance like a sentence of chips. Toggles for legend/gridlines/width sit below the fold." },
  { id: "ed7", file: "ed7-tabbed-settings.html", name: "Tabbed settings rail (Better Stack style)",
    desc: "The chart fills the page with a big headline number; the right rail is tabbed (Chart / Data / Axes / Filters) so no scrolling is ever needed. “Visualize as” is a 2-up grid of large labeled tiles with unavailable types disabled, plus a “compare with previous period” toggle. Best for dense option sets." },
  { id: "ed8", file: "ed8-anchored-popover.html", name: "Anchored popover (Notion style)",
    desc: "The lightest option: clicking edit opens a small popover right next to the card, which stays live in the grid while everything else dims. Chart types are a compact icon strip, then hover rows with disclosure chevrons for Data, Measure, Slice, Segment, Filters. Zero context change, but nested submenus are required." },
  { id: "ed9", file: "ed9-dock-editor.html", name: "Dock tray (Pond native) — interactive",
    desc: "The editor lives in Pond's own dock: hit ✎ on a card and the pill morphs upward into an “Edit insight” tray, Family-style. The edited card stays highlighted in the grid and previews live (try the chart-type strip — bars/area/line actually switch), the rest dims, and ✕/Escape/backdrop morphs back to nav. No new panel paradigm — reuses the same tray the sources flow uses." },
];

let i = 0;
const $ = (id) => document.getElementById(id);

const dots = VARIANTS.map((_, n) => {
  const b = document.createElement("button");
  b.className = "dot";
  b.setAttribute("aria-label", `Variant ${n + 1}`);
  b.onclick = () => go(n);
  $("dots").appendChild(b);
  return b;
});

function go(n) {
  i = Math.max(0, Math.min(VARIANTS.length - 1, n));
  const v = VARIANTS[i];
  $("live").src = v.file;
  $("live").title = v.name;
  $("name").innerHTML = `<small>${v.id}</small>${v.name}`;
  $("desc").textContent = v.desc;
  $("counter").textContent = `${i + 1} / ${VARIANTS.length}`;
  $("openLive").href = v.file;
  $("prev").disabled = i === 0;
  $("next").disabled = i === VARIANTS.length - 1;
  dots.forEach((d, n2) => d.classList.toggle("on", n2 === i));
}

$("prev").onclick = () => go(i - 1);
$("next").onclick = () => go(i + 1);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") go(i - 1);
  if (e.key === "ArrowRight") go(i + 1);
});

go(0);
</script>
</body>
</html>
