<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Big type editorial · dark</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body.light { --ink:#1a1a1c; --ink2:#6b6b70; --ink3:#9b9ba0; --panel:#fff; --line:rgba(0,0,0,.07); --hair:rgba(0,0,0,.055); --hov:rgba(0,0,0,.02);
  --ok:#3c9a52; --okdim:rgba(60,154,82,.12); --warn:#b57e1c; --warndim:rgba(181,126,28,.12); --err:#cf3f3f; --run:#4472d4; --rundim:rgba(68,114,212,.10); color: #1a1a1c; background: #fafafa; }
body.dark { --ink:#ececee; --ink2:#8a8a90; --ink3:#5b5b61; --panel:#121214; --line:rgba(255,255,255,.07); --hair:rgba(255,255,255,.05); --hov:rgba(255,255,255,.02);
  --ok:#4ade80; --okdim:rgba(74,222,128,.13); --warn:#fbbf24; --warndim:rgba(251,191,36,.12); --err:#f87171; --run:#7dd3fc; --rundim:rgba(125,211,252,.12); color: #ececee; background: #0c0c0d; }
.chip { display:inline-block; flex:none; overflow:hidden; vertical-align:middle; background:#fff; box-shadow:0 0 0 1px var(--hair); }
.chip img { display:block; width:100%; height:100%; }
.dot { flex:none; width:6px; height:6px; background:var(--ok); border-radius:50%; }
.dot.run { background:var(--run); } .dot.warn { background:var(--warn); } .dot.err { background:var(--err); }
.badge { display:inline-block; padding:2px 7px; font-size:11px; font-weight:600; border-radius:5px; }
.badge.ok { color:var(--ok); background:var(--okdim); } .badge.warn { color:var(--warn); background:var(--warndim); } .badge.run { color:var(--run); background:var(--rundim); }
.btn { padding:5px 12px; font:inherit; font-size:12.5px; font-weight:550; color:var(--ink); cursor:pointer; background:var(--panel); border:0; border-radius:7px; box-shadow:0 0 0 1px var(--line); }
.btn.primary { color:var(--panel); background:var(--ink); box-shadow:none; }
.panel { background:var(--panel); border-radius:12px; box-shadow:0 0 0 1px var(--hair), 0 1px 3px rgba(0,0,0,.03); }
.ticks { display:flex; gap:2.5px; align-items:flex-end; height:22px; }
.ticks i { flex:1; min-height:4px; background:var(--ok); border-radius:1.5px; opacity:.8; }
.ticks i.z { height:4px; background:var(--hair); }
.ticks i.w { background:var(--warn); }
.num { font-variant-numeric: tabular-nums; }
.st { font-size:10.5px; font-weight:700; letter-spacing:.07em; }
.st.ok { color:var(--ok); } .st.warn { color:var(--warn); } .st.err { color:var(--err); } .st.run { color:var(--run); }

.wrap { max-width:760px; padding:70px 32px 80px; margin:0 auto; }
.huge { font-size:96px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; letter-spacing:-0.05em; }
.huge .d { margin-left:10px; font-size:22px; font-weight:600; vertical-align:super; color:var(--ok); letter-spacing:-.02em; }
.lede { max-width:560px; margin-top:18px; font-size:16px; line-height:1.65; color:var(--ink2); }
.lede b { font-weight:600; color:var(--ink); } .lede .w { font-weight:600; color:var(--warn); }
.srcline { display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:44px; }
.sl { display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--ink2); }
.sl b { font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink); }
.actions { display:flex; gap:8px; margin-top:40px; }</style></head>
<body class="dark"><div class="wrap">
    <div class="huge">5,056<span class="d">+12</span></div>
    <div class="lede">Things you've saved, kept safe on this Mac. <b>Cosmos</b> is bringing in 12 new references right now; <b>Pinterest</b> is <span class="w">waiting out a rate limit</span> until 1:20. Everything else is quiet.</div>
    <div class="srcline">
    <span class="sl"><span class="chip" style="width:18px;height:18px;border-radius:5px"><img src="twitter.svg" alt=""/></span><b>2,381</b> twitter<span class="dot " style="margin-left:2px"></span></span>
    <span class="sl"><span class="chip" style="width:18px;height:18px;border-radius:5px"><img src="cosmos.svg" alt=""/></span><b>312</b> cosmos<span class="dot run" style="margin-left:2px"></span></span>
    <span class="sl"><span class="chip" style="width:18px;height:18px;border-radius:5px"><img src="pinterest.svg" alt=""/></span><b>1,104</b> pinterest<span class="dot warn" style="margin-left:2px"></span></span>
    <span class="sl"><span class="chip" style="width:18px;height:18px;border-radius:5px"><img src="instagram.svg" alt=""/></span><b>694</b> instagram<span class="dot " style="margin-left:2px"></span></span>
    <span class="sl"><span class="chip" style="width:18px;height:18px;border-radius:5px"><img src="arena.svg" alt=""/></span><b>245</b> are.na<span class="dot " style="margin-left:2px"></span></span>
    <span class="sl"><span class="chip" style="width:18px;height:18px;border-radius:5px"><img src="tiktok.svg" alt=""/></span><b>188</b> tiktok<span class="dot " style="margin-left:2px"></span></span>
    <span class="sl"><span class="chip" style="width:18px;height:18px;border-radius:5px"><img src="youtube.svg" alt=""/></span><b>132</b> youtube<span class="dot " style="margin-left:2px"></span></span></div>
    <div class="actions"><button class="btn primary">Sync all</button><button class="btn">Add source</button><button class="btn">Activity</button></div>
  </div></body></html>
