<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Mercury dashboard · light</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body.light { --ink:#1a1a1c; --ink2:#6b6b70; --ink3:#9b9ba0; --panel:#fff; --line:rgba(0,0,0,.07); --hair:rgba(0,0,0,.055); --hov:rgba(0,0,0,.02);
  --ok:#3c9a52; --okdim:rgba(60,154,82,.12); --warn:#b57e1c; --warndim:rgba(181,126,28,.12); --err:#cf3f3f; --run:#4472d4; --rundim:rgba(68,114,212,.10); color: #1a1a1c; background: #fafafa; }
body.dark { --ink:#ececee; --ink2:#8a8a90; --ink3:#5b5b61; --panel:#121214; --line:rgba(255,255,255,.07); --hair:rgba(255,255,255,.05); --hov:rgba(255,255,255,.02);
  --ok:#4ade80; --okdim:rgba(74,222,128,.13); --warn:#fbbf24; --warndim:rgba(251,191,36,.12); --err:#f87171; --run:#7dd3fc; --rundim:rgba(125,211,252,.12); color: #ececee; background: #0c0c0d; }
.chip { display:inline-block; flex:none; overflow:hidden; vertical-align:middle; background:#fff; box-shadow:0 0 0 1px var(--hair); }
.chip img { display:block; width:100%; height:100%; }
.dot { flex:none; width:6px; height:6px; background:var(--ok); border-radius:50%; }
.dot.run { background:var(--run); } .dot.warn { background:var(--warn); } .dot.err { background:var(--err); }
.badge { display:inline-block; padding:2px 7px; font-size:11px; font-weight:600; border-radius:5px; }
.badge.ok { color:var(--ok); background:var(--okdim); } .badge.warn { color:var(--warn); background:var(--warndim); } .badge.run { color:var(--run); background:var(--rundim); }
.btn { padding:5px 12px; font:inherit; font-size:12.5px; font-weight:550; color:var(--ink); cursor:pointer; background:var(--panel); border:0; border-radius:7px; box-shadow:0 0 0 1px var(--line); }
.btn.primary { color:var(--panel); background:var(--ink); box-shadow:none; }
.panel { background:var(--panel); border-radius:12px; box-shadow:0 0 0 1px var(--hair), 0 1px 3px rgba(0,0,0,.03); }
.ticks { display:flex; gap:2.5px; align-items:flex-end; height:22px; }
.ticks i { flex:1; min-height:4px; background:var(--ok); border-radius:1.5px; opacity:.8; }
.ticks i.z { height:4px; background:var(--hair); }
.ticks i.w { background:var(--warn); }
.num { font-variant-numeric: tabular-nums; }
.st { font-size:10.5px; font-weight:700; letter-spacing:.07em; }
.st.ok { color:var(--ok); } .st.warn { color:var(--warn); } .st.err { color:var(--err); } .st.run { color:var(--run); }

.shell { display:grid; grid-template-columns:200px 1fr; min-height:100vh; }
.nav { padding:22px 14px; font-size:12.5px; color:var(--ink2); border-right:1px solid var(--hair); }
.nav .brand { padding:0 8px 18px; font-size:13px; font-weight:650; color:var(--ink); }
.nitem { padding:7px 8px; cursor:pointer; border-radius:6px; } .nitem.sel { font-weight:550; color:var(--ink); background:var(--hov); }
.main { max-width:900px; padding:30px 36px; }
.hello { font-size:18px; font-weight:650; letter-spacing:-.01em; }
.quick { display:flex; gap:8px; margin:14px 0 18px; }
.two { display:grid; grid-template-columns:1.4fr 1fr; gap:14px; }
.bal { padding:18px 20px; } .bl { font-size:12px; color:var(--ink3); } .bv { margin-top:4px; font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
.bd { margin-top:2px; font-size:12px; font-weight:600; color:var(--ok); }
.area { display:block; width:100%; margin-top:12px; }
.accounts { padding:16px 18px; } .accounts h3 { padding-bottom:8px; font-size:12.5px; font-weight:600; }
.acc { display:flex; gap:9px; align-items:center; padding:7px 0; font-size:12.5px; border-top:1px solid var(--hair); }
.acc:first-of-type { border-top:0; } .acc .n { flex:1; font-weight:530; } .acc .v { font-variant-numeric:tabular-nums; color:var(--ink3); }
.movement { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
.mv { padding:15px 18px; } .mv .l { font-size:12px; color:var(--ink3); } .mv .v { margin-top:3px; font-size:16px; font-weight:650; }
.mv .s { padding-top:8px; margin-top:8px; font-size:11.5px; color:var(--ink3); border-top:1px solid var(--hair); }</style></head>
<body class="light"><div class="shell">
    <div class="nav"><div class="brand">◍ Pond</div>
      <div class="nitem">Library</div><div class="nitem sel">Sources</div><div class="nitem">Ask</div><div class="nitem">Tags</div><div class="nitem">Settings</div></div>
    <div class="main">
      <div class="hello">Welcome back</div>
      <div class="quick"><button class="btn primary">Sync all</button><button class="btn">Add source</button><button class="btn">Import</button><button class="btn">Retry failed</button></div>
      <div class="two">
        <div class="bal panel"><div class="bl">Pond total ◍</div><div class="bv">5,056</div><div class="bd">+12 today</div>
          <svg class="area" viewBox="0 0 460 120" fill="none" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6e6ee0" stop-opacity="0.14"/><stop offset="100%" stop-color="#6e6ee0" stop-opacity="0"/></linearGradient></defs>
    <path d="M0 101 L29 100 L58 93 L86 85 L115 88 L144 78 L173 74 L201 68 L230 63 L259 55 L288 49 L316 49 L345 38 L374 35 L403 32 L431 29 L460 19 L460 120 L0 120 Z" fill="url(#ag)"/><path d="M0 101 L29 100 L58 93 L86 85 L115 88 L144 78 L173 74 L201 68 L230 63 L259 55 L288 49 L316 49 L345 38 L374 35 L403 32 L431 29 L460 19" stroke="#6e6ee0" stroke-width="1.5"/></svg></div>
        <div class="accounts panel"><h3>Sources</h3>
    <div class="acc"><span class="chip" style="width:18px;height:18px;border-radius:5px"><img src="twitter.svg" alt=""/></span><span class="n">Twitter</span><span class="dot "></span><span class="v num">2,381</span></div>
    <div class="acc"><span class="chip" style="width:18px;height:18px;border-radius:5px"><img src="cosmos.svg" alt=""/></span><span class="n">Cosmos</span><span class="dot run"></span><span class="v num">312</span></div>
    <div class="acc"><span class="chip" style="width:18px;height:18px;border-radius:5px"><img src="pinterest.svg" alt=""/></span><span class="n">Pinterest</span><span class="dot warn"></span><span class="v num">1,104</span></div>
    <div class="acc"><span class="chip" style="width:18px;height:18px;border-radius:5px"><img src="instagram.svg" alt=""/></span><span class="n">Instagram</span><span class="dot "></span><span class="v num">694</span></div>
    <div class="acc"><span class="chip" style="width:18px;height:18px;border-radius:5px"><img src="arena.svg" alt=""/></span><span class="n">Are.na</span><span class="dot "></span><span class="v num">245</span></div>
          <div class="acc" style="color:var(--ink3)">＋ <span class="n" style="font-weight:400">Connect more</span></div></div>
      </div>
      <div class="movement">
        <div class="mv panel"><div class="l">Collected today</div><div class="v">+12 items</div><div class="s">all from Cosmos · 3 with video</div></div>
        <div class="mv panel"><div class="l">Needs attention</div><div class="v" style="color:var(--warn)">1 source</div><div class="s">Pinterest rate limited · resumes 1:20</div></div>
      </div>
    </div></div></body></html>
