<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Pond — Sources · 50 variants</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { padding: 36px; font: 400 13px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #e8e8ea; background: #101013; }
  h1 { font-size: 16px; font-weight: 650; }
  .sub { margin-top: 4px; font-size: 12px; color: #86868c; }
  .family { margin-top: 34px; }
  .family h2 { padding-bottom: 12px; font-size: 12px; font-weight: 650; color: #86868c; text-transform: uppercase; letter-spacing: .05em; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .cell { display: block; color: inherit; text-decoration: none; }
  .frame { position: relative; width: 100%; aspect-ratio: 1280/860; overflow: hidden; background: #fff; border-radius: 8px; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
  .frame iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 860px; pointer-events: none; border: 0; transform-origin: 0 0; }
  .cap { display: flex; gap: 7px; align-items: baseline; padding: 8px 2px 0; }
  .id { font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: #86868c; }
  .name { font-size: 12px; font-weight: 550; color: #e8e8ea; }
  .cell:hover .frame { box-shadow: 0 0 0 2px #7dd3fc; }
</style>
</head>
<body>
<h1>Sources screen — 50 variants</h1>
<div class="sub">Click any tile to open it full-size. Grouped by layout family.</div>
<div id="root"></div>
<script>
const FAMILIES = [
  ["Fey — narrated finance", [
    ["v01-fey-dark.html", "Fey dark · chart + recap + table"],
    ["v02-fey-light.html", "Fey structure · Pond light"],
    ["v03-fey-report.html", "Fey editorial written report · dark"],
  ]],
  ["Vercel — infra rows & overview", [
    ["v04-vercel.html", "Deployments-style list"],
    ["v05-vercel-overview.html", "Overview hero card + stat cards"],
    ["v20-rows-dense-light.html", "Dense rows · dot status"],
    ["v21-rows-dense-dark.html", "Dense rows · dark"],
    ["v22-rows-badges-light.html", "Dense rows · status badges"],
  ]],
  ["Firecrawl / logs & runs", [
    ["v06-firecrawl.html", "Warm log + dotted header"],
    ["v29-log-light.html", "Activity log · light"],
    ["v30-log-mono-dark.html", "Activity log · terminal dark"],
  ]],
  ["Seline — friendly analytics", [
    ["v07-seline.html", "KPI card strip + bars + ranked list"],
    ["v51-seline-live.html", "Seline live dashboard · fill bars + ask pill"],
    ["v52-seline-connect.html", "Connect flow · picker → sign-in → first sync"],
    ["v53-vercel-projects.html", "Vercel source grid · toolbar + 3-col cards"],
    ["v54-vercel-source-detail.html", "Source detail · latest sync hero + runs + config"],
    ["v55-source-dialog.html", "Source dialog · connection hero + option rows"],
    ["v56-add-source-flow.html", "Add source flow · picker → sign-in → first sync"],
    ["v57-picker-grid.html", "Picker · connector grid with checks (Manus)"],
    ["v58-picker-cards.html", "Picker · brand cards + trust rows (Sprout)"],
    ["v59-connect-confirm.html", "Pre-connect confirm · how-it-works (Ferndesk)"],
    ["v60-connect-permissions.html", "Connect · permissions list (Jobber)"],
    ["v61-connectkit.html", "ConnectKit-style · compact modal, 3 states"],
    ["final-sources.html", "FINAL · interactive: grid + settings dialog + connect flow"],
  ]],
  ["Visitors — chrome-less minimal", [
    ["v08-visitors-light.html", "Plain KPIs + edge chart + rows"],
    ["v09-visitors-dark.html", "Dark + floating dock"],
    ["v39-chart-hero-green-light.html", "Chart hero · green"],
    ["v40-chart-hero-mono-light.html", "Chart hero · monochrome"],
    ["v41-chart-hero-violet-dark.html", "Chart hero · violet dark"],
  ]],
  ["Status page — verdict first", [
    ["v10-status-ticks-light.html", "Verdict + 30-day tick bars"],
    ["v11-status-ticks-dark.html", "Verdict + tick bars · dark"],
    ["v12-status-minimal-light.html", "Verdict + minimal rows"],
    ["v13-status-sparks-light.html", "Verdict + sparklines"],
  ]],
  ["Portfolio — library as holdings", [
    ["v14-portfolio-light.html", "Hero number + rows"],
    ["v15-portfolio-dark.html", "Hero number + rows · dark"],
    ["v16-portfolio-cards-light.html", "Hero + stat cards"],
    ["v37-table-light.html", "Ranked data table"],
    ["v38-table-dark.html", "Ranked data table · dark"],
  ]],
  ["Tiles & grids", [
    ["v17-tiles-2col-light.html", "Tiles · 2 col"],
    ["v18-tiles-3col-sparks-light.html", "Tiles · 3 col + sparklines"],
    ["v19-tiles-2col-dark.html", "Tiles · dark"],
    ["v48-compact-grid-light.html", "Compact stat grid + statusbar"],
    ["v49-compact-grid-dark.html", "Compact stat grid · dark"],
  ]],
  ["Split pane & app shells", [
    ["v23-split-light.html", "Rail + source detail"],
    ["v24-split-dark.html", "Rail + source detail · dark"],
    ["v25-mercury-light.html", "Mercury dashboard"],
    ["v26-mercury-dark.html", "Mercury dashboard · dark"],
  ]],
  ["Narrated & editorial", [
    ["v27-recap-light.html", "Written recap + rows"],
    ["v28-recap-dark.html", "Written recap · dark"],
    ["v33-bigtype-light.html", "Big type editorial"],
    ["v34-bigtype-dark.html", "Big type editorial · dark"],
    ["v50-pond-brand-light.html", "Pond brand hero · ripples"],
  ]],
  ["Timeline & kanban", [
    ["v31-timeline-light.html", "Timeline feed"],
    ["v32-timeline-dark.html", "Timeline feed · dark"],
    ["v35-kanban-light.html", "Kanban by status"],
    ["v36-kanban-dark.html", "Kanban by status · dark"],
  ]],
  ["Data-viz experiments", [
    ["v42-heatmap-light.html", "Contribution heatmap"],
    ["v43-heatmap-dark.html", "Contribution heatmap · dark"],
    ["v44-donut-light.html", "Composition donut"],
    ["v45-donut-dark.html", "Composition donut · dark"],
  ]],
  ["Document style", [
    ["v46-notion-light.html", "Notion document"],
    ["v47-notion-dark.html", "Notion document · dark"],
  ]],
];
const root = document.getElementById("root");
for (const [fam, items] of FAMILIES) {
  const sec = document.createElement("div");
  sec.className = "family";
  sec.innerHTML = `<h2>${fam}</h2>`;
  const grid = document.createElement("div");
  grid.className = "grid";
  for (const [file, name] of items) {
    const a = document.createElement("a");
    a.className = "cell"; a.href = file; a.target = "_blank";
    a.innerHTML = `<div class="frame"><iframe src="${file}" loading="lazy" scrolling="no"></iframe></div>
      <div class="cap"><span class="id">${file.slice(1, 3)}</span><span class="name">${name}</span></div>`;
    grid.appendChild(a);
  }
  sec.appendChild(grid);
  root.appendChild(sec);
}
function fit() {
  for (const f of document.querySelectorAll(".frame")) {
    const s = f.clientWidth / 1280;
    f.querySelector("iframe").style.transform = `scale(${s})`;
  }
}
addEventListener("resize", fit);
addEventListener("load", fit);
fit();
</script>
</body>
</html>
