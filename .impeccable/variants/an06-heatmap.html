<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Analytics · Heatmap</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body.light { --ink:#1a1a1c; --ink2:#6b6b70; --ink3:#9b9ba0; --panel:#fff; --line:rgba(0,0,0,.07); --hair:rgba(0,0,0,.055); --hov:rgba(0,0,0,.02);
  --ok:#3c9a52; --okdim:rgba(60,154,82,.12); --warn:#b57e1c; --warndim:rgba(181,126,28,.12); --err:#cf3f3f; --run:#4472d4; --rundim:rgba(68,114,212,.10); color: #1a1a1c; background: #fafafa; }
body.dark { --ink:#ececee; --ink2:#8a8a90; --ink3:#5b5b61; --panel:#121214; --line:rgba(255,255,255,.07); --hair:rgba(255,255,255,.05); --hov:rgba(255,255,255,.02);
  --ok:#4ade80; --okdim:rgba(74,222,128,.13); --warn:#fbbf24; --warndim:rgba(251,191,36,.12); --err:#f87171; --run:#7dd3fc; --rundim:rgba(125,211,252,.12); color: #ececee; background: #0c0c0d; }
.chip { display:inline-block; flex:none; overflow:hidden; vertical-align:middle; background:#fff; box-shadow:0 0 0 1px var(--hair); }
.chip img { display:block; width:100%; height:100%; }
.dot { flex:none; width:6px; height:6px; background:var(--ok); border-radius:50%; }
.dot.run { background:var(--run); } .dot.warn { background:var(--warn); } .dot.err { background:var(--err); }
.badge { display:inline-block; padding:2px 7px; font-size:11px; font-weight:600; border-radius:5px; }
.badge.ok { color:var(--ok); background:var(--okdim); } .badge.warn { color:var(--warn); background:var(--warndim); } .badge.run { color:var(--run); background:var(--rundim); }
.btn { padding:5px 12px; font:inherit; font-size:12.5px; font-weight:550; color:var(--ink); cursor:pointer; background:var(--panel); border:0; border-radius:7px; box-shadow:0 0 0 1px var(--line); }
.btn.primary { color:var(--panel); background:var(--ink); box-shadow:none; }
.panel { background:var(--panel); border-radius:12px; box-shadow:0 0 0 1px var(--hair), 0 1px 3px rgba(0,0,0,.03); }
.ticks { display:flex; gap:2.5px; align-items:flex-end; height:22px; }
.ticks i { flex:1; min-height:4px; background:var(--ok); border-radius:1.5px; opacity:.8; }
.ticks i.z { height:4px; background:var(--hair); }
.ticks i.w { background:var(--warn); }
.num { font-variant-numeric: tabular-nums; }
.st { font-size:10.5px; font-weight:700; letter-spacing:.07em; }
.st.ok { color:var(--ok); } .st.warn { color:var(--warn); } .st.err { color:var(--err); } .st.run { color:var(--run); }

.wrap { display:flex; flex-direction:column; gap:12px; max-width: 860px; padding: 32px 32px 80px; margin: 0 auto; }
.top { display:flex; align-items:center; } .top h1 { flex:1; font-size:16px; font-weight:650; }
.range { padding:4px 10px; font-size:12px; color:var(--ink2); background:var(--panel); border-radius:6px; box-shadow:0 0 0 1px var(--line); }
.split { display:grid; grid-template-columns: 1.5fr 1fr; gap:12px; }
.panel { padding:14px 16px; }
.pt { display:flex; margin-bottom:12px; font-size:12.5px; font-weight:600; } .pt span:last-child { margin-left:auto; font-size:11px; font-weight:400; color:var(--ink3); }
.hm { display:flex; flex-direction:column; gap:3px; }
.hm-row { display:flex; gap:3px; align-items:center; }
.hm-l { width:26px; padding-right:4px; font-size:10px; color:var(--ink3); text-align:right; }
.hm-d { flex:1; font-size:10px; color:var(--ink3); text-align:center; }
.hm-c { display:grid; flex:1; place-items:center; height:22px; background:var(--hair); border-radius:4px; }
.hm-c i { font-size:9.5px; font-style:normal; font-weight:600; color:#fff; }
.don { display:flex; gap:16px; align-items:center; }
.leg { display:flex; flex:1; flex-direction:column; gap:6px; }
.li { display:flex; gap:8px; align-items:center; font-size:12px; }
.li .sw { width:8px; height:8px; border-radius:2.5px; }
.li .name { flex:1; color:var(--ink2); } .li .v { font-weight:550; font-variant-numeric:tabular-nums; }
.srcs { padding:6px 8px 8px; }
.srow { display:flex; gap:9px; align-items:center; height:32px; padding:0 8px; font-size:12.5px; border-radius:6px; }
.srow:hover { background:var(--hov); }
.srow .name { width:90px; font-weight:550; } .srow .val { width:60px; font-variant-numeric:tabular-nums; color:var(--ink2); text-align:right; }
.srow .spark { margin-left:auto; }
</style></head>
