<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ED6 — Property tokens (Steep style)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    display: flex; flex-direction: column;min-height: 100vh;
    font: 13px/1.45 -apple-system, "SF Pro Text", Inter, sans-serif;color: #1b1b1a; 
    background: #fbfbfa;
  }

  .topbar {
    display: flex; gap: 12px;align-items: center; 
    padding: 11px 20px; background: #fff;border-bottom: 1px solid #ececea;
  }
  .topbar .crumb { font-size: 12px; color: #8a8a86; }
  .topbar .spacer { flex: 1; }
  .ghost { padding: 6px 12px; font: inherit; color: #55554f; cursor: pointer; background: #fff; border: 1px solid #e0e0dd; border-radius: 8px; }
  .primary { padding: 6px 16px; font: inherit; font-weight: 550; color: #fff; cursor: pointer; background: #1b1b1a; border: 0; border-radius: 8px; }

  .main { display: flex; flex: 1; min-height: 0; }

  /* preview column */
  .previews { flex: 1; min-width: 0; padding: 24px 28px; overflow-y: auto; }
  .previews h2 { margin-bottom: 14px; font-size: 15px; font-weight: 640; letter-spacing: -.01em; }
  .pcard {
    margin-bottom: 14px; overflow: hidden;
    background: #fff; border: 1px solid #e7e7e5; border-radius: 12px;
    box-shadow: 0 1px 3px rgba(20,20,19,.04);
  }
  .pcard-head {
    display: flex; gap: 8px;align-items: center; 
    padding: 11px 16px; border-bottom: 1px solid #f5f5f3;
  }
  .pcard-head .disc { font-size: 10px; color: #b3b3af; }
  .pcard-head b { font-size: 12.5px; font-weight: 600; }
  .pcard-head .stat { margin-left: auto; font-size: 17px; font-weight: 640; font-variant-numeric: tabular-nums; }
  .pcard-body { padding: 16px; }
  svg.chart { display: block; }
  .range-tabs { display: flex; gap: 2px; justify-content: center; padding: 8px 0 12px; }
  .range-tabs span { padding: 3px 10px; font-size: 11px; color: #8a8a86; cursor: pointer; border-radius: 6px; }
  .range-tabs span.on { font-weight: 550; color: #1b1b1a; background: #f0f0ee; }
  .legend { display: flex; gap: 12px; padding: 0 16px 14px; font-size: 10.5px; color: #6f6f6c; }
  .legend i { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 2px; }

  /* property rail */
  .rail {
    flex: none; 
    width: 300px; 
    padding: 16px 16px 20px; overflow-y: auto;background: #fff;border-left: 1px solid #ececea;
  }
  .rail-name {
    width: 100%; padding: 6px 9px; margin-bottom: 14px;
    font-family: inherit; font-size: 13px; font-weight: 550;outline: none;
    border: 1px solid #e7e7e5; border-radius: 8px;
  }
  .rail-name::placeholder { font-weight: 450; color: #b3b3af; }

  .prop {
    display: flex; gap: 8px;align-items: center; min-height: 34px;
  }
  .prop .ico { flex: none; width: 16px; font-size: 12px; color: #b3b3af; text-align: center; }
  .prop .key { font-size: 12.5px; color: #55554f; }
  .prop .val { margin-left: auto; }
  .token {
    display: inline-flex; align-items: center; padding: 3px 9px;
    font-size: 12px; font-weight: 550; cursor: pointer;border-radius: 6px;
  }
  .t-cyan { color: #04687d; background: #e0f4f9; }
  .t-violet { color: #4340a8; background: #e9e9fc; }
  .t-green { color: #1c6e42; background: #e2f5e9; }
  .t-gray { color: #55554f; background: #f0f0ee; }
  .t-ghost { font-weight: 450; color: #9c9c98; background: none; border: 1px dashed #d9d9d6; }

  .divider { height: 1px; margin: 12px 0; background: #f0f0ee; }
  .rail-label {
    margin-bottom: 6px;
    font-size: 10.5px; font-weight: 600; 
    color: #9c9c98; text-transform: uppercase;letter-spacing: .04em;
  }
  .switch-row { display: flex; align-items: center; min-height: 32px; }
  .switch-row .key { font-size: 12.5px; color: #55554f; }
  .switch { position: relative; width: 30px; height: 18px; margin-left: auto; cursor: pointer; background: #1b1b1a; border-radius: 9px; }
  .switch::after { position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; content: ""; background: #fff; border-radius: 50%; }
  .switch.offs { background: #d9d9d6; }
  .switch.offs::after { right: auto; left: 2px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="crumb">Overview / New insight</span>
  <span class="spacer"></span>
  <button class="ghost">Cancel</button>
  <button class="primary">Save</button>
</div>

<div class="main">
  <div class="previews">
    <h2>Preview</h2>

    <div class="pcard">
      <div class="pcard-head">
        <span class="disc">▾</span><b>Saves by day</b><span class="stat">1,204</span>
      </div>
      <div class="pcard-body">
        <svg class="chart" width="100%" height="150" viewBox="0 0 700 150" preserveAspectRatio="none">
          <defs>
            <linearGradient id="s1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0797b9" stop-opacity=".3"/><stop offset="1" stop-color="#0797b9" stop-opacity=".02"/></linearGradient>
            <linearGradient id="s2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5b5bd6" stop-opacity=".26"/><stop offset="1" stop-color="#5b5bd6" stop-opacity=".02"/></linearGradient>
          </defs>
          <g stroke="#f0f0ee"><line x1="0" y1="38" x2="700" y2="38"/><line x1="0" y1="75" x2="700" y2="75"/><line x1="0" y1="112" x2="700" y2="112"/></g>
          <path d="M0 110 C80 104 120 66 190 72 C260 78 310 40 390 46 C470 52 530 24 610 20 C650 18 685 26 700 18 L700 150 L0 150 Z" fill="url(#s1)"/>
          <path d="M0 110 C80 104 120 66 190 72 C260 78 310 40 390 46 C470 52 530 24 610 20 C650 18 685 26 700 18" fill="none" stroke="#0797b9" stroke-width="2"/>
          <path d="M0 132 C90 128 160 118 240 122 C320 126 420 110 500 114 C580 118 660 106 700 108 L700 150 L0 150 Z" fill="url(#s2)"/>
          <path d="M0 132 C90 128 160 118 240 122 C320 126 420 110 500 114 C580 118 660 106 700 108" fill="none" stroke="#5b5bd6" stroke-width="2"/>
        </svg>
      </div>
      <div class="legend">
        <span><i style="background:#0797b9"></i>Twitter</span>
        <span><i style="background:#5b5bd6"></i>Cosmos</span>
        <span><i style="background:#ab4aba"></i>Instagram</span>
      </div>
      <div class="range-tabs">
        <span>Week</span><span class="on">Month</span><span>Quarter</span><span>6M</span><span>Year</span><span>All</span>
      </div>
    </div>

    <div class="pcard">
      <div class="pcard-head"><span class="disc">▸</span><b>Breakdown</b></div>
    </div>
  </div>

  <aside class="rail">
    <input class="rail-name" placeholder="Saves by day, split by source" />

    <div class="prop"><span class="ico">▦</span><span class="key">Dataset</span><span class="val token t-cyan">Library saves</span></div>
    <div class="prop"><span class="ico">#</span><span class="key">Measure</span><span class="val token t-cyan">Saves</span></div>
    <div class="prop"><span class="ico">◫</span><span class="key">Display</span><span class="val token t-violet">Area</span></div>
    <div class="prop"><span class="ico">⏱</span><span class="key">Slice by</span><span class="val token t-violet">Day</span></div>
    <div class="prop"><span class="ico">⊞</span><span class="key">Segment by</span><span class="val token t-green">Source</span></div>
    <div class="prop"><span class="ico">≔</span><span class="key">Filter</span><span class="val token t-gray">Source is Twitter, Cosmos</span></div>
    <div class="prop"><span class="ico"></span><span class="key"></span><span class="val token t-ghost">＋ Add filter</span></div>

    <div class="divider"></div>
    <div class="rail-label">Options</div>
    <div class="switch-row"><span class="key">Show legend</span><span class="switch"></span></div>
    <div class="switch-row"><span class="key">Show gridlines</span><span class="switch"></span></div>
    <div class="switch-row"><span class="key">Half width card</span><span class="switch offs"></span></div>
  </aside>
</div>

</body>
</html>
