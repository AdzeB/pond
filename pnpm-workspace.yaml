packages:
  - "apps/*"
  - "packages/*"

# Single source of truth for versions shared across the workspace. Reference
# with the `catalog:` protocol in each package.json to prevent version drift.
catalog:
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  react: ^19.2.8
  react-dom: ^19.2.8
  typescript: ^7.0.2

overrides:
  react: "19.2.8"
  react-dom: "19.2.8"

allowBuilds:
  # Built solely by electron-rebuild in apps/desktop postinstall (Electron ABI).
  # Letting pnpm run its own node-gyp build produces a plain-Node binary that
  # clobbers the Electron build and breaks ELECTRON_RUN_AS_NODE tooling.
  # Icon assets pulled in transitively by replaywebpage; its postinstall is
  # funding output only, nothing needs building.
  "@fortawesome/fontawesome-free": false
  "@google/genai": false
  better-sqlite3: false
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  ffmpeg-static: true
  # Optional bundled-AI dependency. Like better-sqlite3, we don't let pnpm run
  # its node-gyp build (that yields a plain-Node binary); node-llama-cpp resolves
  # the correct prebuilt binaries for this Electron ABI itself on first use.
  node-llama-cpp: false
  onnxruntime-node: true
  protobufjs: true
  # Native module pulled in transitively by metascraper (via url-regex-safe).
  # Not built: pnpm's node-gyp would emit a plain-Node binary that can't load in
  # Electron's main process, and url-regex-safe falls back to RegExp without it.
  re2: false
  sharp: true
  spawn-sync: true

minimumReleaseAgeExclude:
  - better-sqlite3@12.11.1
  - '@next/env@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  - next@16.3.1
  - '@tanstack/ai-anthropic@0.18.3'
  - '@tanstack/ai-client@0.29.2'
  - '@tanstack/ai-event-client@0.11.2'
  - '@tanstack/ai-gemini@0.26.4'
  - '@tanstack/ai-ollama@0.10.3'
  - '@tanstack/ai-openai@0.22.3'
  - '@tanstack/ai-react@0.22.4'
  - '@tanstack/ai@0.52.0'
  - '@tanstack/openai-base@0.10.8'
