<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>11 · Health-matrix</title>
<style>
:root{--bg:#f7f7f6;--panel:#fff;--ink:#14130f;--ink-2:#6b6962;--ink-3:#9a978d;--line:#ececE7;--line-2:#f1f0ec;--hover:#f7f6f2;--ok:#3a9e57;--warn:#c98a16;--err:#cc4b37;--run:#2f7fbf;--live:#2fbf71;--bar:#e7e4dc;--shadow:0 1px 2px rgba(20,19,15,.05)}
*{box-sizing:border-box}html,body{padding:0margin:0;}
body{font-family:ui-sans-serif,-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;font-size:14px-webkit-font-smoothing:antialiased;color:var(--ink);background:var(--bg);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,127,191,.45)}70%{box-shadow:0 0 0 5px rgba(47,127,191,0)}100%{box-shadow:0 0 0 0 rgba(47,127,191,0)}}
@keyframes pulseG{0%{box-shadow:0 0 0 0 rgba(47,191,113,.45)}70%{box-shadow:0 0 0 5px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
.topbar{display:flex;gap:14px;align-items:baseline;width:100%;max-width:880px;padding:40px 32px 0margin:0 auto;}
.topbar h1{margin:0;font-size:24px;font-weight:640;letter-spacing:-.02em}.topbar .crumb{font-size:13.5pxcolor:var(--ink-2);}.topbar .right{margin-left:auto}
.live{display:inline-flex;gap:7px;align-items:center;padding:6px 12pxfont-size:12.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:999px;}.live .ld{width:7px;height:7px;background:var(--live);border-radius:50%;animation:pulseG 2s infinite}
.content{display:flex;flex-direction:column;gap:14pxwidth:100%;max-width:880px;padding:18px 32px 90px;margin:0 auto;}
.monban{display:flex;gap:11px;align-items:center;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.monban .ico{display:grid;place-items:center;width:28px;height:28px;font-size:14px;font-weight:700color:#fff;background:#14130f;border-radius:7px;}
.monban .d{width:7px;height:7px;background:var(--run);border-radius:50%;animation:pulse 1.4s infinite}.monban .t{font-size:13px}.monban .t b{font-weight:620}.monban .right{margin-left:auto;font-family:ui-monospace,Menlo,monospacefont-size:11.5px;color:var(--ink-3);}
.card{padding:16px 18px;overflow-x:autobackground:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
.matrix{display:grid;grid-template-columns:140px repeat(10,1fr) 64px;gap:5px;align-items:center;min-width:640px}
.mh{font-size:10px;color:var(--ink-3);text-align:center}
.mh.left{text-align:left}
.rl{display:flex;gap:8px;align-items:center;font-size:12.5px}
.ico{display:grid;place-items:center;width:20px;height:20px;font-size:10pxfont-weight:700;color:#fff;border-radius:6px;}
.ico.x{background:#14130f}.ico.yt{background:#ce3b30}.ico.ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7)}.ico.rd{background:#e0592a}.ico.bs{background:#1185fe}.ico.ms{background:#6364ff}.ico.rss{background:#f26522}.ico.hn{background:#ff6600}.ico.gh{background:#24292e}
.cell{height:22px;background:var(--bar)border-radius:5px;}
.cell.ok{background:var(--ok)}.cell.ok2{background:rgba(58,158,87,.55)}.cell.err{background:var(--err)}.cell.warn{background:var(--warn)}.cell.run{background:var(--run);animation:pulse 1.4s infinite}.cell.none{background:var(--line-2)}
.rate{font-size:11.5px;font-weight:600font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right;}
.legend{display:flex;gap:14px;margin-top:4pxfont-size:11px;color:var(--ink-2);}.legend span{display:inline-flex;gap:6pxalign-items:center;}.legend i{width:11px;height:11px;border-radius:3px}
.note{margin-top:6pxfont-size:11.5px;color:var(--ink-3);text-align:center;}
</style></head>
<body>
<div class="topbar"><h1>Sources</h1><span class="crumb">Health matrix · last 10 runs</span><span class="right"><span class="live"><span class="ld"></span>1 syncing now</span></span></div>
<div class="content">
  <div class="monban"><span class="ico">𝕏</span><span class="d"></span><span class="t"><b>X / Twitter</b> syncing — harvest 42/120</span><span class="right">00:42</span></div>
  <div class="card">
    <div class="matrix">
      <span class="mh left">Source</span><span class="mh">10</span><span class="mh">9</span><span class="mh">8</span><span class="mh">7</span><span class="mh">6</span><span class="mh">5</span><span class="mh">4</span><span class="mh">3</span><span class="mh">2</span><span class="mh">now</span><span class="mh">Rate</span>
      <span class="rl"><span class="ico x">𝕏</span>X</span><span class="cell ok"></span><span class="cell ok"></span><span class="cell warn"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok2"></span><span class="cell ok"></span><span class="cell warn"></span><span class="cell run"></span><span class="rate">98%</span>
      <span class="rl"><span class="ico yt">▶</span>YouTube</span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="rate">100%</span>
      <span class="rl"><span class="ico rd">r</span>Reddit</span><span class="cell ok"></span><span class="cell none"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell none"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell none"></span><span class="cell ok"></span><span class="cell none"></span><span class="rate">100%</span>
      <span class="rl"><span class="ico ig">◎</span>Instagram</span><span class="cell ok"></span><span class="cell ok"></span><span class="cell err"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell err"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell err"></span><span class="rate">70%</span>
      <span class="rl"><span class="ico bs">⊛</span>Bluesky</span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="rate">100%</span>
      <span class="rl"><span class="ico ms">m</span>Mastodon</span><span class="cell ok"></span><span class="cell none"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell none"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell none"></span><span class="cell ok"></span><span class="rate">100%</span>
      <span class="rl"><span class="ico rss">≈</span>RSS</span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok2"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="rate">100%</span>
      <span class="rl"><span class="ico hn">Y</span>Hacker News</span><span class="cell ok"></span><span class="cell none"></span><span class="cell ok"></span><span class="cell none"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell none"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell none"></span><span class="rate">100%</span>
      <span class="rl"><span class="ico gh">⌥</span>GitHub</span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell ok"></span><span class="cell err"></span><span class="rate">90%</span>
    </div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Success</span><span><i style="background:var(--run)"></i>Running</span><span><i style="background:var(--warn)"></i>Recovered</span><span><i style="background:var(--err)"></i>Error</span><span><i style="background:var(--line-2)"></i>No run</span></div>
  </div>
  <p class="note">11 · Health-matrix</p>
</div>
</body></html>
