<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>09 · Swimlanes</title>
<style>
:root{--bg:#f7f7f6;--panel:#fff;--ink:#14130f;--ink-2:#6b6962;--ink-3:#9a978d;--line:#ececE7;--line-2:#f1f0ec;--hover:#f7f6f2;--ok:#3a9e57;--warn:#c98a16;--err:#cc4b37;--run:#2f7fbf;--live:#2fbf71;--bar:#e7e4dc;--shadow:0 1px 2px rgba(20,19,15,.05)}
*{box-sizing:border-box}html,body{padding:0margin:0;}
body{font-family:ui-sans-serif,-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;font-size:14px-webkit-font-smoothing:antialiased;color:var(--ink);background:var(--bg);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,127,191,.45)}70%{box-shadow:0 0 0 5px rgba(47,127,191,0)}100%{box-shadow:0 0 0 0 rgba(47,127,191,0)}}
@keyframes pulseG{0%{box-shadow:0 0 0 0 rgba(47,191,113,.45)}70%{box-shadow:0 0 0 5px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
@keyframes wid{from{width:30%}to{width:46%}}
.topbar{display:flex;gap:14px;align-items:baseline;width:100%;max-width:900px;padding:40px 32px 0margin:0 auto;}
.topbar h1{margin:0;font-size:24px;font-weight:640;letter-spacing:-.02em}.topbar .crumb{font-size:13.5pxcolor:var(--ink-2);}.topbar .right{margin-left:auto}
.live{display:inline-flex;gap:7px;align-items:center;padding:6px 12pxfont-size:12.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:999px;}.live .ld{width:7px;height:7px;background:var(--live);border-radius:50%;animation:pulseG 2s infinite}
.content{display:flex;flex-direction:column;gap:12pxwidth:100%;max-width:900px;padding:18px 32px 90px;margin:0 auto;}
.axis{display:grid;grid-template-columns:130px 1fr;gap:0;padding:0 14pxfont-size:10.5px;color:var(--ink-3);}
.axis .ticks{display:flex;justify-content:space-between}
.board{overflow:hiddenbackground:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
.lane{display:grid;grid-template-columns:130px 1fr;align-items:center;min-height:46pxborder-bottom:1px solid var(--line-2);}.lane:last-child{border-bottom:0}
.lane .name{display:flex;gap:8px;align-items:center;padding:0 12px;font-size:12.5px}
.ico{display:grid;place-items:center;width:22px;height:22px;font-size:11pxfont-weight:700;color:#fff;border-radius:6px;}
.ico.x{background:#14130f}.ico.yt{background:#ce3b30}.ico.ig{background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7)}.ico.rd{background:#e0592a}.ico.bs{background:#1185fe}.ico.ms{background:#6364ff}.ico.rss{background:#f26522}.ico.hn{background:#ff6600}.ico.gh{background:#24292e}
.track{position:relative;height:46px;border-left:1px solid var(--line-2)}
.tick{position:absolute;top:50%;width:14pxheight:14px;border-radius:3px;transform:translateY(-50%);}
.tick.ok{background:var(--ok)}.tick.err{background:var(--err)}.tick.warn{background:var(--warn)}.tick.idle{background:var(--bar)}
.bar{position:absolute;top:50%;height:16px;background:linear-gradient(90deg,var(--run),#5aa0d8);border-radius:4px;box-shadow:0 0 0 0 rgba(47,127,191,.4)transform:translateY(-50%);animation:wid 2.4s ease-in-out infinite alternate;}
.gridlines{position:absolute;inset:0;pointer-events:none}.gridlines i{position:absolute;top:0;bottom:0;width:1px;background:var(--line-2)}
.legend{display:flex;gap:14px;padding:2px 14pxfont-size:11px;color:var(--ink-2);}.legend span{display:inline-flex;gap:6pxalign-items:center;}.legend i{width:10px;height:10px;border-radius:3px}
.note{margin-top:6pxfont-size:11.5px;color:var(--ink-3);text-align:center;}
</style></head>
<body>
<div class="topbar"><h1>Sources</h1><span class="crumb">Run lanes · last 6h</span><span class="right"><span class="live"><span class="ld"></span>1 syncing now</span></span></div>
<div class="content">
  <div class="axis"><span></span><div class="ticks"><span>10:00</span><span>11:00</span><span>12:00</span><span>13:00</span><span>14:00</span><span>15:00</span><span>now</span></div></div>
  <div class="board">
    <div class="lane"><span class="name"><span class="ico x">𝕏</span>X</span><div class="track"><div class="gridlines"><i style="left:16.6%"></i><i style="left:33.3%"></i><i style="left:50%"></i><i style="left:66.6%"></i><i style="left:83.3%"></i></div><span class="tick warn" style="left:84%"></span><span class="bar" style="right:1%;width:42%"></span></div></div>
    <div class="lane"><span class="name"><span class="ico yt">▶</span>YouTube</span><div class="track"><div class="gridlines"><i style="left:16.6%"></i><i style="left:33.3%"></i><i style="left:50%"></i><i style="left:66.6%"></i><i style="left:83.3%"></i></div><span class="tick ok" style="left:84%"></span><span class="tick ok" style="left:96%"></span></div></div>
    <div class="lane"><span class="name"><span class="ico rd">r</span>Reddit</span><div class="track"><div class="gridlines"><i style="left:16.6%"></i><i style="left:33.3%"></i><i style="left:50%"></i><i style="left:66.6%"></i><i style="left:83.3%"></i></div><span class="tick idle" style="left:90%"></span></div></div>
    <div class="lane"><span class="name"><span class="ico ig">◎</span>Instagram</span><div class="track"><div class="gridlines"><i style="left:16.6%"></i><i style="left:33.3%"></i><i style="left:50%"></i><i style="left:66.6%"></i><i style="left:83.3%"></i></div><span class="tick err" style="left:91%"></span></div></div>
    <div class="lane"><span class="name"><span class="ico bs">⊛</span>Bluesky</span><div class="track"><div class="gridlines"><i style="left:16.6%"></i><i style="left:33.3%"></i><i style="left:50%"></i><i style="left:66.6%"></i><i style="left:83.3%"></i></div><span class="tick ok" style="left:88%"></span></div></div>
    <div class="lane"><span class="name"><span class="ico ms">m</span>Mastodon</span><div class="track"><div class="gridlines"><i style="left:16.6%"></i><i style="left:33.3%"></i><i style="left:50%"></i><i style="left:66.6%"></i><i style="left:83.3%"></i></div><span class="tick idle" style="left:80%"></span></div></div>
    <div class="lane"><span class="name"><span class="ico rss">≈</span>RSS</span><div class="track"><div class="gridlines"><i style="left:16.6%"></i><i style="left:33.3%"></i><i style="left:50%"></i><i style="left:66.6%"></i><i style="left:83.3%"></i></div><span class="tick ok" style="left:50%"></span><span class="tick ok" style="left:95%"></span></div></div>
    <div class="lane"><span class="name"><span class="ico hn">Y</span>Hacker News</span><div class="track"><div class="gridlines"><i style="left:16.6%"></i><i style="left:33.3%"></i><i style="left:50%"></i><i style="left:66.6%"></i><i style="left:83.3%"></i></div><span class="tick idle" style="left:40%"></span></div></div>
    <div class="lane"><span class="name"><span class="ico gh">⌥</span>GitHub</span><div class="track"><div class="gridlines"><i style="left:16.6%"></i><i style="left:33.3%"></i><i style="left:50%"></i><i style="left:66.6%"></i><i style="left:83.3%"></i></div><span class="tick err" style="left:34%"></span></div></div>
  </div>
  <div class="legend"><span><i style="background:var(--run)"></i>Running</span><span><i style="background:var(--ok)"></i>Success</span><span><i style="background:var(--warn)"></i>Recovered</span><span><i style="background:var(--err)"></i>Error</span><span><i style="background:var(--bar)"></i>No new items</span></div>
  <p class="note">09 · Swimlanes</p>
</div>
</body></html>
