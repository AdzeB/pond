<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>14 · Minimal-zen</title>
<style>
:root{--bg:#f7f7f6;--panel:#fff;--ink:#14130f;--ink-2:#6b6962;--ink-3:#9a978d;--line:#ececE7;--line-2:#f1f0ec;--hover:#f7f6f2;--ok:#3a9e57;--warn:#c98a16;--err:#cc4b37;--run:#2f7fbf;--live:#2fbf71;--bar:#e7e4dc;--shadow:0 1px 2px rgba(20,19,15,.05)}
*{box-sizing:border-box}html,body{padding:0margin:0;}
body{font-family:ui-sans-serif,-apple-system,"SF Pro Text","Inter",system-ui,sans-serif;font-size:14px-webkit-font-smoothing:antialiased;color:var(--ink);background:var(--bg);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,127,191,.4)}70%{box-shadow:0 0 0 6px rgba(47,127,191,0)}100%{box-shadow:0 0 0 0 rgba(47,127,191,0)}}
@keyframes pulseG{0%{box-shadow:0 0 0 0 rgba(47,191,113,.45)}70%{box-shadow:0 0 0 6px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
.wrap{width:100%;max-width:680px;padding:64px 32px 90px;margin:0 auto;text-align:center}
.eyebrow{font-size:12px;color:var(--ink-3)text-transform:uppercase;letter-spacing:.12em;}
.big{margin:8px 0 0;font-size:72px;font-weight:680;font-variant-numeric:tabular-numsletter-spacing:-.04em;}
.bigsub{font-size:14px;color:var(--ink-2)}.bigsub b{color:var(--ok)}
.hero{display:flex;gap:5px;align-items:flex-end;height:120pxmargin:30px 0 8px;}
.hero i{flex:1;background:rgba(47,127,191,.22)border-radius:4px 4px 0 0;}.hero i.hl{background:var(--run)}
.dots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:34px 0 0}
.dot{display:inline-flex;gap:7px;align-items:center;font-size:12px;color:var(--ink-2)}
.dot .d{width:9px;height:9px;border-radius:50%}
.d.ok{background:var(--ok)}.d.run{background:var(--run);animation:pulse 1.4s infinite}.d.err{background:var(--err)}.d.idle{background:var(--ink-3)}.d.paused{background:var(--warn)}
.now{display:flex;gap:10px;align-items:center;max-width:420px;padding:11px 14px;margin:36px auto 0;text-align:leftbackground:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);}
.now .ico{display:grid;place-items:center;width:26px;height:26px;font-size:13px;font-weight:700color:#fff;background:#14130f;border-radius:7px;}
.now .rd{width:7px;height:7px;background:var(--run);border-radius:50%;animation:pulse 1.4s infinite}.now .t{font-size:12.5px}.now .t b{font-weight:620}.now .r{margin-left:auto;font-family:ui-monospace,Menlo,monospacefont-size:11px;color:var(--ink-3);}
.tiny{max-width:420px;margin:24px auto 0;font-size:12px;color:var(--ink-3)text-align:left;}
.tiny .e{display:flex;gap:8px;align-items:centerpadding:5px 0;}.tiny .e .ed{width:6px;height:6px;border-radius:50%}.tiny .e .et{flex:1}.tiny .e .ex{font-family:ui-monospace,Menlo,monospace}
.ed.ok{background:var(--ok)}.ed.err{background:var(--err)}.ed.run{background:var(--run)}
.note{margin-top:34pxfont-size:11.5px;color:var(--ink-3);text-align:center;}
</style></head>
<body>
<div class="wrap">
  <div class="eyebrow">Items synced · last 7 days</div>
  <div class="big">3,418</div>
  <div class="bigsub"><b>↑ 12.4%</b> vs last week · 99.1% success</div>
  <div class="hero"><i style="height:30%"></i><i style="height:48%"></i><i style="height:40%"></i><i style="height:62%"></i><i style="height:52%"></i><i style="height:70%"></i><i style="height:58%"></i><i style="height:80%"></i><i style="height:66%"></i><i style="height:88%"></i><i style="height:74%"></i><i style="height:60%"></i><i style="height:92%"></i><i class="hl" style="height:100%"></i></div>
  <div class="dots">
    <span class="dot"><span class="d run"></span>X</span><span class="dot"><span class="d ok"></span>YouTube</span><span class="dot"><span class="d idle"></span>Reddit</span><span class="dot"><span class="d err"></span>Instagram</span><span class="dot"><span class="d ok"></span>Bluesky</span><span class="dot"><span class="d idle"></span>Mastodon</span><span class="dot"><span class="d ok"></span>RSS</span><span class="dot"><span class="d idle"></span>HN</span><span class="dot"><span class="d paused"></span>GitHub</span>
  </div>
  <div class="now"><span class="ico">𝕏</span><span class="rd"></span><span class="t"><b>X</b> syncing — 42 / 120</span><span class="r">00:42</span></div>
  <div class="tiny">
    <div class="e"><span class="ed run"></span><span class="et">X harvesting page 3/6</span><span class="ex">16:02</span></div>
    <div class="e"><span class="ed ok"></span><span class="et">RSS queued 22</span><span class="ex">16:01</span></div>
    <div class="e"><span class="ed ok"></span><span class="et">YouTube queued 8</span><span class="ex">15:59</span></div>
    <div class="e"><span class="ed err"></span><span class="et">Instagram rate limited</span><span class="ex">15:53</span></div>
  </div>
  <p class="note">14 · Minimal-zen</p>
</div>
</body></html>
